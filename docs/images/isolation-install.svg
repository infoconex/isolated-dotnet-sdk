<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="460" viewBox="0 0 1050 460" role="img" aria-labelledby="title desc">
  <title id="title">Linux Bash isolated SDK install transcript</title>
  <desc id="desc">Normalized real end-to-end transcript showing .NET SDK 10.0.100 installed successfully under ~/dotnet-sdks/10.0.100.</desc>
  <rect width="1050" height="460" rx="10" fill="#14161a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#e2e4e8">
    <text x="28" y="46" font-size="24" font-weight="700">Linux/Bash — normalized real E2E transcript</text>
    <text x="28" y="92" font-size="22">$ ~/dotnet-sdks/isolated-dotnet-sdk.sh install 10.0.100 --yes</text>
    <text x="28" y="128" font-size="22">isolated-dotnet-sdk: Target SDK: 10.0.100</text>
    <text x="28" y="164" font-size="22">isolated-dotnet-sdk: Isolated install directory: ~/dotnet-sdks/10.0.100</text>
    <text x="28" y="200" font-size="22">isolated-dotnet-sdk: Loading Microsoft release metadata for SDK 10.0.100...</text>
    <text x="28" y="236" font-size="22">isolated-dotnet-sdk: Downloading .NET SDK 10.0.100 payload...</text>
    <text x="28" y="272" font-size="22">isolated-dotnet-sdk: Extracting verified .NET SDK 10.0.100 payload...</text>
    <text x="28" y="308" font-size="22">isolated-dotnet-sdk: Verifying the isolated SDK...</text>
    <text x="28" y="344" font-size="22">isolated-dotnet-sdk: Isolated SDK installation completed successfully.</text>
    <text x="28" y="380" font-size="22">isolated-dotnet-sdk: Location: ~/dotnet-sdks/10.0.100</text>
    <text x="28" y="422" font-size="16" fill="#a5aab2">Product output from current-main E2E; CI HOME normalized to ~ and timestamps omitted.</text>
  </g>
</svg>
