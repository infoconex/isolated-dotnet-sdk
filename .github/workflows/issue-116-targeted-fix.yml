name: Issue 116 targeted PowerShell Audit

on:
  push:
    branches:
      - issue-116-sdk-audit
    paths:
      - .github/workflows/issue-116-targeted-fix.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
      - name: Apply focused fixes
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath ./isolated-dotnet-sdk.ps1 -Raw
          $source = $source.Replace('Get-AuditChannelMetadata', 'Get-AuditChannelRecord')
          Set-Content -LiteralPath ./isolated-dotnet-sdk.ps1 -Value $source -NoNewline

          $tests = Get-Content -LiteralPath ./tests/powershell/audit.Tests.ps1 -Raw
          $tests = $tests.Replace('Write-StandardMetadata', 'Write-StandardMetadataFixture')
          $tests = $tests.Replace('(?ms)^Isolated SDKs:\r?\n  10\.0\.401  Current', 'Isolated SDKs:')
          $tests = $tests.Replace('(?ms)^System SDKs:\r?\n  10\.0\.401  Current', 'System SDKs:')
          $tests = $tests.Replace("Set-Content -LiteralPath (Join-Path `$script:MetadataRoot '10.0.json') -Value 'not-json'", "Set-Content -LiteralPath (Join-Path `$script:MetadataRoot '10.0.json') -Value '{}'")
          Set-Content -LiteralPath ./tests/powershell/audit.Tests.ps1 -Value $tests -NoNewline
      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit $false `
              -GitHubEnvironmentFile $env:GITHUB_ENV
      - name: Run analyzer and formatter check
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run targeted Audit tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion ((Get-Content .config/test-frameworks.json -Raw | ConvertFrom-Json).pesterVersion) -Force
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'issue-116-fake-host'
          try {
              $env:ISOLATED_DOTNET_SDK_SHARED_FAKE_HOST_ROOT = & ./tests/powershell/New-FakeDotNetHost.ps1 -OutputRoot $fixtureRoot
              $result = Invoke-Pester -Path ./tests/powershell/audit.Tests.ps1 -PassThru -Output Detailed
              if ($result.Result -ne 'Passed') { exit 1 }
          }
          finally {
              Remove-Item Env:ISOLATED_DOTNET_SDK_SHARED_FAKE_HOST_ROOT -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Commit validated fixes
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ./.github/workflows/issue-116-targeted-fix.yml -Force
          Remove-Item -LiteralPath ./.github/workflows/issue-116-powershell-fix.yml -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isolated-dotnet-sdk.ps1 tests/powershell/audit.Tests.ps1 .github/workflows
          git commit -m 'fix: satisfy PowerShell Audit validation' -m 'Refs #116'
          git push origin HEAD:issue-116-sdk-audit
