name: Issue 105 implementation

on:
  push:
    branches:
      - release/issue-105-cli-presentation

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: run issue 105 implementation' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation
      - name: Apply presentation implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-105-apply.py')
          text = path.read_text()
          text = text.replace(
              '    return Format-ToolMessage -Kind Accent -Message $Message',
              '    return (Format-ToolMessage -Kind Accent -Message $Message)')
          text = text.replace(
              '  source "$repo_root/isolated-dotnet-sdk.sh" --help >/dev/null 2>&1 || true\n  result="$(format_tool_input $\'x\\t\')"',
              '  eval "$(sed -n \'/^format_tool_input()/,/^}/p\' "$repo_root/isolated-dotnet-sdk.sh")"\n  result="$(format_tool_input $\'x\\t\')"')
          path.write_text(text)
          PY
          python .github/issue-105-apply.py
          rm -f .github/issue-105-red.py .github/issue-105-apply.py .github/workflows/issue-105-red.yml
          bash -n isolated-dotnet-sdk.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "isolated-dotnet-sdk.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: polish interactive CLI presentation'
          git push origin HEAD:release/issue-105-cli-presentation

  bash-green:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bats-cache
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/bats
          key: isolated-dotnet-sdk-bats-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/test-frameworks.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: shellcheck-cache
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/shellcheck
          key: isolated-dotnet-sdk-shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/static-analysis.json') }}
      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh '${{ steps.bats-cache.outputs.cache-hit }}' '${{ steps.shellcheck-cache.outputs.cache-hit }}'
      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_home="$RUNNER_TEMP/shellcheck-home"
          mkdir -p "$shellcheck_home"
          printf 'shell=sh\n' > "$shellcheck_home/.shellcheckrc"
          HOME="$shellcheck_home" SHELLCHECK_OPTS='--shell=sh' bash scripts/run-shellcheck.sh
      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh

  powershell-green:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation
          persist-credentials: false
      - name: Resolve PowerShell cache identity
        id: pwsh-cache-identity
        shell: pwsh
        run: '"version=$($PSVersionTable.PSVersion.ToString())" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: powershell-module-cache
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/powershell-modules
          key: isolated-dotnet-sdk-pwsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.pwsh-cache-identity.outputs.version }}-${{ hashFiles('.config/test-frameworks.json', '.config/static-analysis.json') }}
      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit ('${{ steps.powershell-module-cache.outputs.cache-hit }}' -eq 'true') `
              -GitHubEnvironmentFile $env:GITHUB_ENV
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
