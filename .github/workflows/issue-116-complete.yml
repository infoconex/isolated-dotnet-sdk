name: Issue 116 final contract validation

on:
  push:
    branches:
      - issue-116-sdk-audit
    paths:
      - .github/workflows/issue-116-complete.yml

permissions:
  contents: write

jobs:
  bash:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
          persist-credentials: false
      - name: Apply final contract patch
        run: python3 .github/scripts/issue-116-complete.py
      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh false false
      - name: Validate Bash source and E2E syntax
        shell: bash
        run: |
          bash -n isolated-dotnet-sdk.sh
          bash -n tests/e2e/bash/direct.sh
          bash -n tests/e2e/bash/interactive.sh
      - name: Run ShellCheck
        shell: bash
        run: bash scripts/run-shellcheck.sh
      - name: Run Bash behavioral suite
        shell: bash
        run: bash tests/bash/run-tests.sh

  powershell:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
          persist-credentials: false
      - name: Apply final contract patch
        shell: pwsh
        run: python .github/scripts/issue-116-complete.py
      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit $false `
              -GitHubEnvironmentFile $env:GITHUB_ENV
      - name: Validate PowerShell parser
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @('./isolated-dotnet-sdk.ps1', './tests/e2e/powershell/direct.ps1', './tests/e2e/powershell/interactive.ps1')) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
              $errors += $parseErrors
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Run analyzer and formatting checks
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run PowerShell behavioral suite
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-audit:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
          persist-credentials: false
      - name: Apply final contract patch
        run: python3 .github/scripts/issue-116-complete.py
      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh false false
      - name: Validate Bash compatibility and Audit behavior
        shell: bash
        run: |
          bash -n isolated-dotnet-sdk.sh
          bash -n tests/e2e/bash/direct.sh
          bash -n tests/e2e/bash/interactive.sh
          bats tests/bash/audit.bats

  commit:
    needs: [bash, powershell, macos-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
      - name: Apply validated patch and remove harness
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/issue-116-complete.py
          rm .github/scripts/issue-116-complete.py
          rm .github/workflows/issue-116-complete.yml
          git diff --check
          if grep -R -n -E 'Issue #[0-9]+|PR #[0-9]+' README.md docs/commands docs/getting-started docs/concepts/sdk-discovery.md docs/contracts/behavioral-parity.md; then
            echo 'Public-facing documentation contains implementation-history references.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete SDK Audit contract' -m 'Refs #116'
          git push origin HEAD:issue-116-sdk-audit
