name: Issue 72 implementation v3

on:
  push:
    branches:
      - security/72-verify-sdk-payload
    paths:
      - .github/issue-72-trigger-v3

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/72-verify-sdk-payload

      - name: Fix patch helper and apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/issue-72-apply.py')
          text = p.read_text()
          old = 'new_text, count = re.subn(pattern, replacement, text, flags=flags)'
          new = 'new_text, count = re.subn(pattern, lambda _: replacement, text, flags=flags)'
          if old not in text:
              raise SystemExit('patcher helper line not found')
          p.write_text(text.replace(old, new))
          PY
          python .github/issue-72-apply.py

      - name: Check generated syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n isolated-dotnet-sdk.sh
          python -m json.tool .config/remote-artifacts.json >/dev/null

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add isolated-dotnet-sdk.sh isolated-dotnet-sdk.ps1 tests/bash/installer-integrity.bats tests/powershell/installer-integrity.Tests.ps1 .config/remote-artifacts.json scripts/Invoke-DependencyUpdateCheck.ps1
          git commit -m 'feat: verify downloaded SDK payload integrity'
          git push origin HEAD:security/72-verify-sdk-payload
