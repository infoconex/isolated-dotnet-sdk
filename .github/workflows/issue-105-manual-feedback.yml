name: Issue 105 manual UX feedback

on:
  push:
    branches:
      - release/issue-105-cli-presentation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/issue-105-cli-presentation

      - name: Apply requested refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'isolated-dotnet-sdk.ps1',
              "function Install-IsolatedSdk {\n    if (-not (Resolve-InstallVersion)) {\n        return\n    }\n\n    $InstallDir = Join-Path $SdkRoot $Version\n",
              "function Install-IsolatedSdk {\n    $SelectedInteractively = [string]::IsNullOrWhiteSpace($script:Version)\n    if (-not (Resolve-InstallVersion)) {\n        return\n    }\n\n    if ($SelectedInteractively) {\n        Write-ToolDisplay\n    }\n\n    $InstallDir = Join-Path $SdkRoot $Version\n")
          replace_once(
              'isolated-dotnet-sdk.ps1',
              "    else {\n        Write-ToolLabelValue -Label 'System SDK:' -Value 'Not installed'\n    }\n\n    if ($IsolatedInstalled) {\n",
              "    else {\n        Write-ToolLabelValue -Label 'System SDK:' -Value 'Not installed'\n    }\n\n    Write-ToolDisplay\n\n    if ($IsolatedInstalled) {\n")
          replace_once(
              'isolated-dotnet-sdk.ps1',
              '            Write-ToolDisplay "  $($Sdk.Version)  $($Sdk.Path)"\n',
              '            Write-ToolDisplay "  $($Sdk.Version)  $(Join-Path $Sdk.Path $Sdk.Version)"\n')

          replace_once(
              'isolated-dotnet-sdk.sh',
              'install_isolated_sdk() {\n    resolve_install_version || return 0\n\n    local install_dir="$SDK_ROOT/$VERSION"\n',
              'install_isolated_sdk() {\n    local selected_interactively="false"\n    if [[ -z "$VERSION" ]]; then\n        selected_interactively="true"\n    fi\n\n    resolve_install_version || return 0\n\n    if [[ "$selected_interactively" == "true" ]]; then\n        echo\n    fi\n\n    local install_dir="$SDK_ROOT/$VERSION"\n')
          replace_once(
              'isolated-dotnet-sdk.sh',
              '    else\n        tool_label_value "System SDK:" "Not installed"\n    fi\n\n    if [[ "$isolated_installed" == "true" ]]; then\n',
              '    else\n        tool_label_value "System SDK:" "Not installed"\n    fi\n\n    echo\n\n    if [[ "$isolated_installed" == "true" ]]; then\n')
          replace_once(
              'isolated-dotnet-sdk.sh',
              '            sdk_path="${BASH_REMATCH[2]}"\n            printf "  %s  %s\\n" "$version" "$sdk_path"\n',
              '            sdk_path="${BASH_REMATCH[2]%/}/$version"\n            printf "  %s  %s\\n" "$version" "$sdk_path"\n')

          p = Path('tests/powershell/installed-sdk-listing.Tests.ps1')
          text = p.read_text()
          text = text.replace("$text | Should -Match '10\\.0\\.401  C:\\\\Program Files\\\\dotnet\\\\sdk'", "$text | Should -Match ([regex]::Escape('10.0.401  C:\\Program Files\\dotnet\\sdk\\10.0.401'))")
          text = text.replace("$text | Should -Match '9\\.0\\.318  D:\\\\dotnet sdk'", "$text | Should -Match ([regex]::Escape('9.0.318  D:\\dotnet sdk\\9.0.318'))")
          p.write_text(text)

          p = Path('tests/bash/installed-sdk-listing.bats')
          text = p.read_text().replace('10.0.401  /usr/share/dotnet/sdk"*', '10.0.401  /usr/share/dotnet/sdk/10.0.401"*')
          text = text.replace('9.0.318  /opt/dotnet sdk"*', '9.0.318  /opt/dotnet sdk/9.0.318"*')
          p.write_text(text)

          p = Path('tests/powershell/install-status.Tests.ps1')
          text = p.read_text()
          text = text.replace("        $text | Should -Match 'Isolated SDK: Not installed'\n        $text | Should -Match 'Install an isolated copy in addition to the System SDK\\?'", "        $text | Should -Match 'Isolated SDK: Not installed'\n        $text | Should -Match 'Location: C:\\\\system\\\\sdk\\r?\\n\\r?\\nIsolated SDK: Not installed'\n        $text | Should -Match 'Install an isolated copy in addition to the System SDK\\?'")
          text = text.replace("        $text | Should -Match 'System SDK: Not installed'\n        $text | Should -Match 'Isolated SDK: Already installed'", "        $text | Should -Match 'System SDK: Not installed'\n        $text | Should -Match 'System SDK: Not installed\\r?\\n\\r?\\nIsolated SDK: Already installed'\n        $text | Should -Match 'Isolated SDK: Already installed'")
          text = text.replace("        $text | Should -Match 'Location: C:\\\\system\\\\sdk'\n        $text | Should -Match 'Isolated SDK: Already installed'", "        $text | Should -Match 'Location: C:\\\\system\\\\sdk'\n        $text | Should -Match 'Location: C:\\\\system\\\\sdk\\r?\\n\\r?\\nIsolated SDK: Already installed'\n        $text | Should -Match 'Isolated SDK: Already installed'")
          text = text.replace("        $text | Should -Match 'System SDK: Not installed'\n        $text | Should -Match 'Isolated SDK: Not installed'", "        $text | Should -Match 'System SDK: Not installed'\n        $text | Should -Match 'System SDK: Not installed\\r?\\n\\r?\\nIsolated SDK: Not installed'\n        $text | Should -Match 'Isolated SDK: Not installed'")
          p.write_text(text)

          p = Path('tests/bash/install-status.bats')
          text = p.read_text()
          text = text.replace('  [[ "$output" == *"Isolated SDK: Not installed"* ]]\n  [[ "$output" == *"Installation cancelled."* ]]', '  [[ "$output" == *"Isolated SDK: Not installed"* ]]\n  [[ "$output" == *$\'Location: /system/sdk\\n\\nIsolated SDK: Not installed\'* ]]\n  [[ "$output" == *"Installation cancelled."* ]]')
          text = text.replace('  [[ "$output" == *"System SDK: Not installed"* ]]\n  [[ "$output" == *"Isolated SDK: Already installed"* ]]', '  [[ "$output" == *"System SDK: Not installed"* ]]\n  [[ "$output" == *$\'System SDK: Not installed\\n\\nIsolated SDK: Already installed\'* ]]\n  [[ "$output" == *"Isolated SDK: Already installed"* ]]')
          text = text.replace('  [[ "$output" == *"Location: /system/sdk"* ]]\n  [[ "$output" == *"Isolated SDK: Already installed"* ]]', '  [[ "$output" == *"Location: /system/sdk"* ]]\n  [[ "$output" == *$\'Location: /system/sdk\\n\\nIsolated SDK: Already installed\'* ]]\n  [[ "$output" == *"Isolated SDK: Already installed"* ]]')
          text = text.replace('  [[ "$output" == *"System SDK: Not installed"* ]]\n  [[ "$output" == *"Isolated SDK: Not installed"* ]]', '  [[ "$output" == *"System SDK: Not installed"* ]]\n  [[ "$output" == *$\'System SDK: Not installed\\n\\nIsolated SDK: Not installed\'* ]]\n  [[ "$output" == *"Isolated SDK: Not installed"* ]]')
          p.write_text(text)

          p = Path('tests/powershell/presentation.Tests.ps1')
          text = p.read_text().replace("        $source | Should -Match 'function Format-ToolAccent'\n", "        $source | Should -Match 'function Format-ToolAccent'\n        $source | Should -Match '(?s)\\$SelectedInteractively = \\[string\\]::IsNullOrWhiteSpace\\(\\$script:Version\\).*?if \\(\\$SelectedInteractively\\) \\{\\s*Write-ToolDisplay'\n")
          p.write_text(text)

          p = Path('tests/bash/presentation.bats')
          text = p.read_text().replace("  grep -Fq 'tool_metadata() {' \"$repo_root/isolated-dotnet-sdk.sh\"\n", "  grep -Fq 'tool_metadata() {' \"$repo_root/isolated-dotnet-sdk.sh\"\n  grep -Fq 'selected_interactively=\"true\"' \"$repo_root/isolated-dotnet-sdk.sh\"\n  grep -Fq 'if [[ \"$selected_interactively\" == \"true\" ]]; then' \"$repo_root/isolated-dotnet-sdk.sh\"\n")
          p.write_text(text)
          PY

      - name: Check syntax and whitespace
        shell: bash
        run: |
          set -euo pipefail
          bash -n isolated-dotnet-sdk.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./isolated-dotnet-sdk.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git diff --check

      - name: Commit refinements and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-105-manual-feedback.yml
          git config user.name 'Jim Scott'
          git config user.email 'jscott@infoconex.com'
          git add isolated-dotnet-sdk.ps1 isolated-dotnet-sdk.sh tests/powershell/install-status.Tests.ps1 tests/bash/install-status.bats tests/powershell/installed-sdk-listing.Tests.ps1 tests/bash/installed-sdk-listing.bats tests/powershell/presentation.Tests.ps1 tests/bash/presentation.bats .github/workflows/issue-105-manual-feedback.yml
          git commit -m 'fix: refine install spacing and SDK paths'
          git push origin HEAD:release/issue-105-cli-presentation
