name: Issue 83 branch edit

on:
  push:
    branches:
      - release/issue-83-installed-sdk-listing
    paths:
      - scripts/issue-83-apply.py
      - .github/workflows/issue-83-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Prepare behavioral-parity row for scoped edit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/behavioral-parity.md')
          text = path.read_text(encoding='utf-8')
          list_row = '| List | Report the isolated SDK root and recognized installed version directories; report `None` when empty. |\n'
          detection_row = '| Existing SDK detection | Distinguish SDKs already available from the system `dotnet` host from SDKs already present under the isolated root. |\n'
          if detection_row not in text:
              if list_row not in text:
                  raise SystemExit('Expected List contract row was not found.')
              text = text.replace(list_row, list_row + detection_row, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Apply scoped Issue 83 edits
        run: python3 scripts/issue-83-apply.py

      - name: Remove temporary edit scaffolding
        run: rm -f scripts/issue-83-apply.py .github/workflows/issue-83-apply.yml

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show isolated and system SDKs'
          git push origin HEAD:release/issue-83-installed-sdk-listing
