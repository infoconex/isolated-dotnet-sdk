name: Issue 83 branch edit

on:
  push:
    branches:
      - release/issue-83-installed-sdk-listing
    paths:
      - scripts/issue-83-apply.py
      - .github/workflows/issue-83-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Apply scoped Issue 83 edits
        run: python3 scripts/issue-83-apply.py

      - name: Remove temporary edit scaffolding
        run: rm -f scripts/issue-83-apply.py .github/workflows/issue-83-apply.yml

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show isolated and system SDKs'
          git push origin HEAD:release/issue-83-installed-sdk-listing
