name: Issue 72 PowerShell fixture refactor

on:
  push:
    branches:
      - security/72-verify-sdk-payload
    paths:
      - .github/issue-72-fix3-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/72-verify-sdk-payload
      - shell: bash
        run: python .github/issue-72-fix3.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/powershell/sdk-payload-fixture.ps1 tests/powershell/native-failures.Tests.ps1 tests/powershell/transactional-install.Tests.ps1 tests/powershell/finalization-failures.Tests.ps1 tests/powershell/behavior.Tests.ps1 tests/powershell/dependency-update-monitoring.Tests.ps1
          git commit -m 'test: exercise verified SDK payload transactions on PowerShell'
          git push origin HEAD:security/72-verify-sdk-payload
