name: Issue 22 fixture cleanup

on:
  push:
    branches:
      - issue-22-supply-chain-integrity
    paths:
      - .github/workflows/issue22-fixture-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-22-supply-chain-integrity

      - name: Adapt deterministic fixtures and public bootstrap guidance
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          expected = '3bb07bc8025211836c1e4f9d3f6a044e55b1fb6eec518a6c78851d04e210442b'
          needle = "& pwsh -NoProfile -Command '\nfunction Invoke-WebRequest"
          replacement = "& pwsh -NoProfile -Command '\nfunction Get-FileHash {\n    param([string]$LiteralPath, [string]$Algorithm)\n    [pscustomobject]@{ Hash = '" + expected + "' }\n}\nfunction Invoke-WebRequest"
          for name in [
              'tests/powershell/finalization-failures.Tests.ps1',
              'tests/powershell/native-failures.Tests.ps1',
              'tests/powershell/transactional-install.Tests.ps1',
          ]:
              path = Path(name)
              text = path.read_text()
              count = text.count(needle)
              if count == 0:
                  raise SystemExit(f'No child Invoke-WebRequest seams found in {name}')
              path.write_text(text.replace(needle, replacement), newline='')

          readme = Path('README.md')
          text = readme.read_text()
          start = text.index('## Quick Start — Stable Release')
          end = text.index('### Development / `main`')
          secure = '''## Quick Start — Stable Release

Stable installation is explicitly version-pinned and integrity-checked. Choose a release published under the Issue #22 policy, substitute its tag for `<release-tag>`, and use the checksum-verifying bootstrap commands in [`docs/release-bootstrap.md`](docs/release-bootstrap.md). Those commands download both the explicitly tagged platform script and that release's `SHA256SUMS`, verify the script's SHA-256 before execution, and then execute the verified temporary file so file-based bootstrap preserves those exact bytes under `~/dotnet-sdks`.

`v0.1.0` predates this integrity policy and does not have a `SHA256SUMS` release asset. It remains available as legacy history but is not compatible with the checksum-verifying stable bootstrap.

The first verified run creates `~/dotnet-sdks` if needed, saves the platform-specific tool there for future use, and then opens the interactive menu.

```text
isolated-dotnet-sdk: What would you like to do?

  1. Install an SDK
  2. Remove an isolated SDK
  3. List isolated SDKs
  4. Exit

Selection:
```

Normal execution of the saved tool does not auto-update. To update, rerun the verified stable bootstrap with a newer published tag. To roll back, rerun it with an older published tag. The release/bootstrap document contains the copy/paste PowerShell and Bash commands plus the maintainer release contract.

'''
          text = text[:start] + secure + text[end:]
          old_security = 'Stable bootstrap downloads and executes source from an explicit published tag. Development commands intentionally download and execute mutable `main`. Review remote scripts first if you prefer not to execute remote code directly. Artifact-integrity protections such as checksums or signing are tracked separately from this release/bootstrap policy.'
          new_security = 'Stable bootstrap for releases published under the Issue #22 policy verifies the explicitly tagged script against that release\'s `SHA256SUMS` before execution. SDK installation downloads Microsoft\'s install helper from an immutable upstream commit and verifies its repository-pinned SHA-256 before execution. The downloaded .NET SDK payload itself remains an explicit Microsoft distribution trust boundary; independent SDK-archive checksum verification is deferred for later hardening. Development commands intentionally consume mutable `main` and do not receive the stable-release integrity guarantee.'
          if old_security not in text:
              raise SystemExit('Expected README security note was not found')
          readme.write_text(text.replace(old_security, new_security), newline='')
          PY

          rm .github/workflows/issue22-fixture-cleanup.yml
          git config user.name 'infoconex'
          git config user.email 'jscott@infoconex.com'
          git add README.md tests/powershell .github/workflows/issue22-fixture-cleanup.yml
          git commit -m 'test: adapt PowerShell fixtures to integrity gate'
          git push origin HEAD:issue-22-supply-chain-integrity
