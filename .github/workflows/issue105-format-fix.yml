name: Issue 105 PowerShell formatting

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/issue105-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/issue-105-cli-presentation
          fetch-depth: 0

      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-format-modules') `
              -CacheHit $false `
              -GitHubEnvironmentFile $env:GITHUB_ENV

      - name: Format PowerShell
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit formatting and remove harness
        shell: pwsh
        run: |
          Remove-Item .github/workflows/issue105-format-fix.yml
          git config user.name "Jim Scott"
          git config user.email "jscott@infoconex.com"
          git add -A
          git commit -m "style: format removal presentation changes"
          git push origin HEAD:release/issue-105-cli-presentation
