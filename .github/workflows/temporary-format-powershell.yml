name: Temporary PowerShell Formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'issue-115-interactive-verify'
    runs-on: windows-2025

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-115-interactive-verify

      - name: Prepare pinned PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-format-modules') `
              -CacheHit $false `
              -GitHubEnvironmentFile $env:GITHUB_ENV

      - name: Apply repository PowerShell formatter
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Write
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Commit formatter output
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- isolated-dotnet-sdk.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Output 'Formatter produced no changes.'
              exit 0
          }
          git commit -m 'style: apply PowerShell formatter'
          git push origin HEAD:issue-115-interactive-verify
