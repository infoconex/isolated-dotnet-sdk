name: Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/images/**'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage documentation site source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .pages-source _site
          mkdir -p .pages-source/docs
          cp README.md CHANGELOG.md LICENSE .pages-source/

          while IFS= read -r -d '' file; do
            destination=".pages-source/$file"
            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"
          done < <(find docs -type f -name '*.md' -print0)

          if [[ -d docs/images ]]; then
            mkdir -p .pages-source/docs/images
            cp -R docs/images/. .pages-source/docs/images/
          fi

          test ! -e .pages-source/tests
          test ! -e .pages-source/scripts
          test ! -e .pages-source/dotnet-install.sh
          test ! -e .pages-source/dotnet-install.ps1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./.pages-source
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy Pages site
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
