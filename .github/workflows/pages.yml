name: Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '.config/test-frameworks.json'
      - '.config/static-analysis.json'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'install.ps1'
      - 'install.sh'
      - 'search-index.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '.config/test-frameworks.json'
      - '.config/static-analysis.json'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'install.ps1'
      - 'install.sh'
      - 'search-index.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage documentation site source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .pages-source _site
          mkdir -p .pages-source/docs .pages-source/.config

          stage_markdown() {
            source="$1"
            destination=".pages-source/$source"
            mkdir -p "$(dirname "$destination")"

            if head -n 1 "$source" | grep -qx -- '---'; then
              cp "$source" "$destination"
            else
              {
                printf '%s\n' '---' 'layout: default' '---' ''
                cat "$source"
              } > "$destination"
            fi
          }

          stage_markdown README.md
          stage_markdown CHANGELOG.md
          cp LICENSE .pages-source/
          cp .config/test-frameworks.json .config/static-analysis.json .pages-source/.config/
          cp _config.yml search-index.json .pages-source/
          cp install.ps1 install.sh .pages-source/
          cp -R _data _layouts assets .pages-source/

          while IFS= read -r -d '' file; do
            stage_markdown "$file"
          done < <(find docs -type f -name '*.md' -print0)

          node --check .pages-source/assets/js/site.js

          test -f .pages-source/install.ps1
          test -f .pages-source/install.sh
          test ! -e .pages-source/tests
          test ! -e .pages-source/scripts
          test ! -e .pages-source/dotnet-install.sh
          test ! -e .pages-source/dotnet-install.ps1
          test ! -e .pages-source/isolated-dotnet-sdk.sh
          test ! -e .pages-source/isolated-dotnet-sdk.ps1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./.pages-source
          destination: ./_site

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -f _site/docs/index.html
          test -f _site/docs/commands/install.html
          test -f _site/docs/getting-started/windows-powershell.html
          test -f _site/docs/getting-started/linux-macos-bash.html
          test -f _site/assets/search-index.json
          test -f _site/assets/css/site.css
          test -f _site/assets/js/site.js
          test -f _site/install.ps1
          test -f _site/install.sh

          cmp install.ps1 _site/install.ps1
          cmp install.sh _site/install.sh
          python -m json.tool _site/assets/search-index.json >/dev/null

          grep -q 'class="docs-nav"' _site/index.html
          grep -q 'Search documentation' _site/index.html
          grep -q 'Getting Started' _site/index.html
          grep -q 'docs/commands/install.html' _site/index.html
          grep -q 'aria-current="page"' _site/docs/commands/install.html
          grep -q '"title": "Install"' _site/assets/search-index.json

          shopt -s nullglob
          release_note_files=(.github/release-notes/v*.md)
          for release_notes in "${release_note_files[@]}"; do
            tag="$(basename "$release_notes" .md)"
            history_source="docs/releases/history/$tag.md"
            history_link="history/$tag.md"
            history_page="_site/docs/releases/history/$tag.html"

            if [[ ! -f "$history_source" ]]; then
              printf 'Release history missing for %s: %s\n' "$tag" "$history_source" >&2
              exit 1
            fi
            if ! grep -Fq "$history_link" docs/releases/README.md; then
              printf 'Releases overview does not link %s\n' "$history_source" >&2
              exit 1
            fi
            if ! grep -Fq "path: $history_source" _data/navigation.yml; then
              printf 'Pages navigation does not include %s\n' "$history_source" >&2
              exit 1
            fi
            if [[ ! -f "$history_page" ]]; then
              printf 'Release history page did not generate: %s\n' "$history_page" >&2
              exit 1
            fi
            if ! grep -Fq "docs/releases/history/$tag.html" _site/assets/search-index.json; then
              printf 'Release history is missing from the Pages search index: %s\n' "$tag" >&2
              exit 1
            fi
          done

          while IFS= read -r path; do
            case "$path" in
              README.md)
                generated="_site/index.html"
                ;;
              */README.md)
                generated="_site/${path%README.md}index.html"
                ;;
              *.md)
                generated="_site/${path%.md}.html"
                ;;
              *)
                generated="_site/$path"
                ;;
            esac

            if [[ ! -f "$generated" ]]; then
              printf 'Navigation target did not generate: %s -> %s\n' "$path" "$generated" >&2
              exit 1
            fi
          done < <(awk '/^[[:space:]]+path:/ { print $2 }' _data/navigation.yml)

          test ! -e _site/tests
          test ! -e _site/scripts
          test ! -e _site/isolated-dotnet-sdk.sh
          test ! -e _site/isolated-dotnet-sdk.ps1

      - name: Stage pull request preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .pages-preview
          mkdir -p .pages-preview/isolated-dotnet-sdk
          cp -a _site/. .pages-preview/isolated-dotnet-sdk/
          diff -qr _site .pages-preview/isolated-dotnet-sdk

      - name: Upload pull request preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-preview-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ./.pages-preview
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Publish pull request preview instructions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PREVIEW_NAME: pages-preview-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            printf '## Pages preview\n\n'
            printf 'Artifact: [%s](%s)\n\n' "$PREVIEW_NAME" "$PREVIEW_URL"
            printf '%s\n\n' 'Review the exact rendered pull-request site locally:'
            printf '%s\n' '1. Download and extract the artifact.'
            printf '%s\n' '2. From the extracted artifact root, run `python -m http.server 8000`.'
            printf '%s\n\n' '3. Open <http://localhost:8000/isolated-dotnet-sdk/> in a browser.'
            printf '%s\n' 'The artifact expires after 7 days and is never deployed to the production Pages site.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    name: Deploy Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
