name: Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '.config/test-frameworks.json'
      - '.config/static-analysis.json'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'install.ps1'
      - 'install.sh'
      - 'search-index.json'
      - '.github/workflows/pages.yml'
      - '.github/scripts/prepare-pages-source.sh'
      - '.github/scripts/validate-pages-output.sh'
      - '.github/scripts/check-documentation-links.js'
      - '.github/scripts/check-pages-gate.js'
      - '.github/scripts/classify-ci-changes.js'
      - 'tests/node/ci-validation.test.js'
      - 'tests/node/documentation-links.test.js'
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify Pages validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      documentation: ${{ steps.files.outputs.documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Pages classification and gate policy
        shell: bash
        run: node --test tests/node/ci-validation.test.js tests/node/documentation-links.test.js
      - name: Classify Pages input changes
        id: files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { classify } = require('./.github/scripts/classify-ci-changes.js');
            let files = [];
            let expectedCount;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100
              });
              expectedCount = context.payload.pull_request.changed_files;
            }
            const choice = classify(context.eventName, files, expectedCount);
            core.info(choice.reason);
            core.setOutput('documentation', String(choice.documentation));

  build:
    name: Build Pages site
    needs: classify
    if: ${{ needs.classify.outputs.documentation == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown local links
        shell: bash
        run: node .github/scripts/check-documentation-links.js
      - name: Stage documentation site source
        shell: bash
        run: bash .github/scripts/prepare-pages-source.sh
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./.pages-source
          destination: ./_site
      - name: Validate generated site
        shell: bash
        run: bash .github/scripts/validate-pages-output.sh
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          include-hidden-files: true

  pages-gate:
    name: Pages gate
    needs: [classify, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require applicable Pages validation to succeed
        shell: bash
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          DOCUMENTATION_REQUIRED: ${{ needs.classify.outputs.documentation }}
          PAGES_BUILD_RESULT: ${{ needs.build.result }}
        run: node .github/scripts/check-pages-gate.js

  deploy:
    name: Deploy Pages site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, pages-gate]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
