name: Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '.config/test-frameworks.json'
      - '.config/static-analysis.json'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'search-index.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '.config/test-frameworks.json'
      - '.config/static-analysis.json'
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'search-index.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage documentation site source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .pages-source _site
          mkdir -p .pages-source/docs .pages-source/.config

          stage_markdown() {
            source="$1"
            destination=".pages-source/$source"
            mkdir -p "$(dirname "$destination")"

            if head -n 1 "$source" | grep -qx -- '---'; then
              cp "$source" "$destination"
            else
              {
                printf '%s\n' '---' 'layout: default' '---' ''
                cat "$source"
              } > "$destination"
            fi
          }

          stage_markdown README.md
          stage_markdown CHANGELOG.md
          cp LICENSE .pages-source/
          cp .config/test-frameworks.json .config/static-analysis.json .pages-source/.config/
          cp _config.yml search-index.json .pages-source/
          cp -R _data _layouts assets .pages-source/

          while IFS= read -r -d '' file; do
            stage_markdown "$file"
          done < <(find docs -type f -name '*.md' -print0)

          test ! -e .pages-source/tests
          test ! -e .pages-source/scripts
          test ! -e .pages-source/dotnet-install.sh
          test ! -e .pages-source/dotnet-install.ps1
          test ! -e .pages-source/isolated-dotnet-sdk.sh
          test ! -e .pages-source/isolated-dotnet-sdk.ps1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./.pages-source
          destination: ./_site

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -f _site/docs/index.html
          test -f _site/docs/commands/install.html
          test -f _site/docs/getting-started/windows-powershell.html
          test -f _site/docs/getting-started/linux-macos-bash.html
          test -f _site/assets/search-index.json
          test -f _site/assets/css/site.css
          test -f _site/assets/js/site.js

          grep -q 'class="docs-nav"' _site/index.html
          grep -q 'Search documentation' _site/index.html
          grep -q 'Getting Started' _site/index.html
          grep -q 'docs/commands/install.html' _site/index.html
          grep -q '"title": "Install"' _site/assets/search-index.json

          test ! -e _site/tests
          test ! -e _site/scripts
          test ! -e _site/isolated-dotnet-sdk.sh
          test ! -e _site/isolated-dotnet-sdk.ps1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    name: Deploy Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
