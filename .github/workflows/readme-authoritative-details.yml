name: README authoritative details refinement

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/readme-authoritative-details.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: release/issue-105-cli-presentation

      - name: Convert authoritative references to bullets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = "For the authoritative details, see [`docs/supply-chain-integrity.md`](docs/supply-chain-integrity.md), [`docs/filesystem-safety.md`](docs/filesystem-safety.md), [`docs/release-bootstrap.md`](docs/release-bootstrap.md), [`docs/cross-platform-support.md`](docs/cross-platform-support.md), and [`docs/behavioral-parity.md`](docs/behavioral-parity.md)."
          new = """For the authoritative details, see:\n\n- [`docs/supply-chain-integrity.md`](docs/supply-chain-integrity.md)\n- [`docs/filesystem-safety.md`](docs/filesystem-safety.md)\n- [`docs/release-bootstrap.md`](docs/release-bootstrap.md)\n- [`docs/cross-platform-support.md`](docs/cross-platform-support.md)\n- [`docs/behavioral-parity.md`](docs/behavioral-parity.md)"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one authoritative-details sentence, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit README refinement and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readme-authoritative-details.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: format authoritative references as a list'
          git push origin HEAD:release/issue-105-cli-presentation
