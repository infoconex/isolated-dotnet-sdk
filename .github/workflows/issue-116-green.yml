name: Issue 116 GREEN

on:
  push:
    branches:
      - issue-116-sdk-audit
    paths:
      - .github/workflows/issue-116-green.yml

permissions:
  contents: write

jobs:
  bash-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply Audit implementation
        run: python3 .github/scripts/issue-116-apply-core.py
      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh false false
      - name: Check Bash syntax
        shell: bash
        run: bash -n isolated-dotnet-sdk.sh
      - name: Run Audit Bats tests
        shell: bash
        run: bats tests/bash/audit.bats

  powershell-green:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply Audit implementation
        shell: pwsh
        run: python .github/scripts/issue-116-apply-core.py
      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit $false `
              -GitHubEnvironmentFile $env:GITHUB_ENV
      - name: Run Audit Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion ((Get-Content .config/test-frameworks.json -Raw | ConvertFrom-Json).pesterVersion) -Force
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'issue-116-fake-host'
          try {
              $env:ISOLATED_DOTNET_SDK_SHARED_FAKE_HOST_ROOT = & ./tests/powershell/New-FakeDotNetHost.ps1 -OutputRoot $fixtureRoot
              $result = Invoke-Pester -Path ./tests/powershell/audit.Tests.ps1 -PassThru -Output Detailed
              if ($result.Result -ne 'Passed') { exit 1 }
          }
          finally {
              Remove-Item Env:ISOLATED_DOTNET_SDK_SHARED_FAKE_HOST_ROOT -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

  commit-green:
    needs:
      - bash-green
      - powershell-green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply validated Audit implementation
        run: python3 .github/scripts/issue-116-apply-core.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            isolated-dotnet-sdk.ps1 \
            isolated-dotnet-sdk.sh \
            tests/bash/audit.bats \
            tests/bash/interactive-lifecycle.bats \
            tests/bash/global-exit.bats \
            tests/powershell/audit.Tests.ps1 \
            tests/powershell/interactive-lifecycle.Tests.ps1 \
            tests/powershell/global-exit.Tests.ps1
          git commit -m 'feat: add SDK audit operation' -m 'Refs #116'
          git push origin HEAD:issue-116-sdk-audit
