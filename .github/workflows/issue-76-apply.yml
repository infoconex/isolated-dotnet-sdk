name: Issue 76 Apply Implementation

on:
  push:
    branches:
      - release/issue-76-verify-health-check

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply implementation patch
        shell: bash
        run: python3 scripts/issue-76-apply.py

      - name: Remove temporary helper files
        shell: bash
        run: rm -f .github/workflows/issue-76-apply.yml scripts/issue-76-apply.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'Jim Scott'
          git config user.email 'jscott@infoconex.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add isolated SDK verification'
          git push origin HEAD:release/issue-76-verify-health-check
