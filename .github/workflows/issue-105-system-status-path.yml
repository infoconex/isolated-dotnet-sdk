name: Issue 105 System SDK status path refinement

on:
  push:
    branches:
      - release/issue-105-cli-presentation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/issue-105-cli-presentation

      - name: Apply refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'isolated-dotnet-sdk.ps1',
              "            Write-ToolLabelValue -Label 'Location:' -Value $SystemSdk.Path\n",
              "            Write-ToolLabelValue -Label 'Location:' -Value (Join-Path $SystemSdk.Path $SystemSdk.Version)\n")

          replace_once(
              'isolated-dotnet-sdk.sh',
              '            system_sdk_path="${BASH_REMATCH[1]}"\n',
              '            system_sdk_path="${BASH_REMATCH[1]%/}/$VERSION"\n')

          p = Path('tests/powershell/install-status.Tests.ps1')
          text = p.read_text()
          text = text.replace("'Location: C:\\\\system\\\\sdk'", "'Location: C:\\\\system\\\\sdk\\\\99\\.0\\.100'")
          text = text.replace("'Location: C:\\\\system\\\\sdk\\r?\\n\\r?\\nIsolated SDK: Not installed'", "'Location: C:\\\\system\\\\sdk\\\\99\\.0\\.100\\r?\\n\\r?\\nIsolated SDK: Not installed'")
          text = text.replace("'Location: C:\\\\system\\\\sdk\\r?\\n\\r?\\nIsolated SDK: Already installed'", "'Location: C:\\\\system\\\\sdk\\\\99\\.0\\.100\\r?\\n\\r?\\nIsolated SDK: Already installed'")
          p.write_text(text)

          p = Path('tests/bash/install-status.bats')
          text = p.read_text()
          text = text.replace('"Location: /system/sdk"', '"Location: /system/sdk/$version"')
          text = text.replace("$'Location: /system/sdk\\n\\nIsolated SDK: Not installed'", "$'Location: /system/sdk/99.0.100\\n\\nIsolated SDK: Not installed'")
          text = text.replace("$'Location: /system/sdk\\n\\nIsolated SDK: Already installed'", "$'Location: /system/sdk/99.0.100\\n\\nIsolated SDK: Already installed'")
          p.write_text(text)
          PY

      - name: Check syntax and whitespace
        shell: bash
        run: |
          set -euo pipefail
          bash -n isolated-dotnet-sdk.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./isolated-dotnet-sdk.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git diff --check

      - name: Commit refinement and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-105-system-status-path.yml
          git config user.name 'Jim Scott'
          git config user.email 'jscott@infoconex.com'
          git add isolated-dotnet-sdk.ps1 isolated-dotnet-sdk.sh tests/powershell/install-status.Tests.ps1 tests/bash/install-status.bats .github/workflows/issue-105-system-status-path.yml
          git commit -m 'fix: show full System SDK install-status path'
          git push origin HEAD:release/issue-105-cli-presentation
