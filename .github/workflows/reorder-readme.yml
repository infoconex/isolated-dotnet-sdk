name: Reorder README documentation

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/reorder-readme.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation

      - name: Reorder README sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text()
          matches = list(re.finditer(r'^## (.+)$', text, re.M))
          if not matches:
              raise SystemExit('README contains no level-two sections')

          preamble = text[:matches[0].start()].rstrip() + '\n\n'
          sections = {}
          for i, match in enumerate(matches):
              name = match.group(1)
              start = match.start()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
              if name in sections:
                  raise SystemExit(f'duplicate level-two section: {name}')
              sections[name] = text[start:end].rstrip() + '\n\n'

          remove = {'Why This Exists', 'Security Note'}
          expected = set(sections) - remove
          order = [
              'Requirements',
              'Security and isolation at a glance',
              'Quick Start — Stable Release',
              'Isolation in Practice',
              'Interactive Install',
              'Install a Specific SDK',
              'List Installed SDKs',
              'Verify an Isolated SDK',
              'Use an Isolated SDK',
              'Remove an Isolated SDK',
              'Automation and Failure Behavior',
              'PowerShell / Bash Behavioral Parity',
              'Directory Layout',
              'Microsoft Release Metadata',
              'Operational Contract Reference',
              'Microsoft References',
              'License',
          ]

          if set(order) != expected:
              missing = expected - set(order)
              extra = set(order) - expected
              raise SystemExit(f'order mismatch; missing={sorted(missing)!r}, extra={sorted(extra)!r}')

          # The opening paragraphs already explain why the project exists, so the
          # late duplicate Why This Exists section is intentionally removed.
          # The early security overview already contains the checksum/trust model
          # and authoritative links, so the late duplicate Security Note is removed.
          path.write_text(preamble + ''.join(sections[name] for name in order).rstrip() + '\n')
          PY

          git diff --check

          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('README.md').read_text()
          headings = re.findall(r'^## (.+)$', text, re.M)
          expected = [
              'Requirements',
              'Security and isolation at a glance',
              'Quick Start — Stable Release',
              'Isolation in Practice',
              'Interactive Install',
              'Install a Specific SDK',
              'List Installed SDKs',
              'Verify an Isolated SDK',
              'Use an Isolated SDK',
              'Remove an Isolated SDK',
              'Automation and Failure Behavior',
              'PowerShell / Bash Behavioral Parity',
              'Directory Layout',
              'Microsoft Release Metadata',
              'Operational Contract Reference',
              'Microsoft References',
              'License',
          ]
          if headings != expected:
              raise SystemExit(f'unexpected README order: {headings!r}')
          if '## Why This Exists' in text or '## Security Note' in text:
              raise SystemExit('duplicate late overview section remains')
          if '.svg' in text or 'docs/images/' in text:
              raise SystemExit('removed SVG reference remains in README')
          PY

      - name: Commit README order and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reorder-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: improve README information hierarchy'
          git push origin HEAD:release/issue-105-cli-presentation
