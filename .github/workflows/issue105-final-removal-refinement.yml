name: Issue 105 final removal refinement

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/issue105-final-removal-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/issue-105-cli-presentation
          fetch-depth: 0

      - name: Apply refinement
        run: python3 .github/scripts/issue105_final_refinement.py

      - name: Check parsers and diff
        shell: bash
        run: |
          bash -n isolated-dotnet-sdk.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "isolated-dotnet-sdk.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git diff --check

      - name: Commit refinement and remove harness
        shell: bash
        run: |
          rm .github/workflows/issue105-final-removal-refinement.yml
          rm .github/scripts/issue105_final_refinement.py
          git config user.name "Jim Scott"
          git config user.email "jscott@infoconex.com"
          git add -A
          git commit -m "fix: quiet removal shutdown presentation"
          git push origin HEAD:release/issue-105-cli-presentation
