name: Issue 105 final removal refinement

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/issue105-final-removal-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/issue-105-cli-presentation
          fetch-depth: 0

      - name: Apply removal presentation refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'isolated-dotnet-sdk.ps1',
              '''    Write-ToolWarning "Isolated SDK $Version will be removed from $InstallDir"

    $ConfirmWasSpecified = $PSBoundParameters.ContainsKey('Confirm')''',
              '''    Write-ToolDisplay
    Write-ToolWarning "Isolated SDK $Version will be removed from $InstallDir"
    Write-ToolDisplay

    $ConfirmWasSpecified = $PSBoundParameters.ContainsKey('Confirm')''')

          replace_once(
              'isolated-dotnet-sdk.ps1',
              '''function Invoke-IsolatedSdkBuildServerShutdown {
    param(
        [string]$DotNetPath,
        [string]$SdkVersion
    )

    & $DotNetPath build-server shutdown
    if ($LASTEXITCODE -ne 0) {
        throw "Build-server shutdown failed for SDK $SdkVersion with exit code $LASTEXITCODE."
    }
}''',
              '''function Invoke-IsolatedSdkBuildServerShutdown {
    param(
        [string]$DotNetPath,
        [string]$SdkVersion
    )

    $EnvironmentOverrides = @{
        DOTNET_NOLOGO                      = 'true'
        DOTNET_GENERATE_ASPNET_CERTIFICATE = 'false'
        DOTNET_ADD_GLOBAL_TOOLS_TO_PATH    = 'false'
    }
    $PreviousEnvironment = @{}

    try {
        foreach ($Name in $EnvironmentOverrides.Keys) {
            $PreviousEnvironment[$Name] = [Environment]::GetEnvironmentVariable($Name, 'Process')
            [Environment]::SetEnvironmentVariable($Name, $EnvironmentOverrides[$Name], 'Process')
        }

        $null = & $DotNetPath build-server shutdown
        $ExitCode = $LASTEXITCODE
    }
    finally {
        foreach ($Name in $EnvironmentOverrides.Keys) {
            [Environment]::SetEnvironmentVariable($Name, $PreviousEnvironment[$Name], 'Process')
        }
    }

    if ($ExitCode -ne 0) {
        throw "Build-server shutdown failed for SDK $SdkVersion with exit code $ExitCode."
    }
}''')

          replace_once(
              'isolated-dotnet-sdk.sh',
              '''    tool_warn "Isolated SDK $VERSION will be removed from $install_dir"

    if ! confirm_action "Continue?"; then''',
              '''    echo
    tool_warn "Isolated SDK $VERSION will be removed from $install_dir"
    echo

    if ! confirm_action "Continue?"; then''')

          replace_once(
              'isolated-dotnet-sdk.sh',
              '''    tool_info "Shutting down build servers for SDK $VERSION..."
    if "$isolated_dotnet" build-server shutdown; then
        :
    else''',
              '''    tool_info "Shutting down build servers for SDK $VERSION..."
    if DOTNET_NOLOGO=true \
       DOTNET_GENERATE_ASPNET_CERTIFICATE=false \
       DOTNET_ADD_GLOBAL_TOOLS_TO_PATH=false \
       "$isolated_dotnet" build-server shutdown >/dev/null; then
        :
    else''')

          Path('tests/powershell/removal-presentation.Tests.ps1').write_text(r'''Describe 'PowerShell removal presentation' {
    BeforeAll {
        $script:RepositoryRoot = (Resolve-Path (Join-Path $PSScriptRoot '../..')).Path
        $script:ToolScript = Join-Path $script:RepositoryRoot 'isolated-dotnet-sdk.ps1'

        $tokens = $null
        $errors = $null
        $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $script:ToolScript,
            [ref]$tokens,
            [ref]$errors)
        if ($errors.Count -gt 0) {
            throw "Unable to parse product script: $($errors[0].Message)"
        }

        $functionDefinition = $ast.FindAll(
            {
                param($node)
                $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                    $node.Name -eq 'Invoke-IsolatedSdkBuildServerShutdown'
            },
            $true) | Select-Object -First 1

        $bodyText = $functionDefinition.Body.Extent.Text
        $bodyText = $bodyText.Substring(1, $bodyText.Length - 2)
        Set-Item \
            -Path Function:script:Invoke-IsolatedSdkBuildServerShutdown \
            -Value ([scriptblock]::Create($bodyText))
    }

    It 'suppresses successful child shutdown chatter and scopes first-run controls' {
        $fakeDotNet = Join-Path $TestDrive 'dotnet.cmd'
        Set-Content -LiteralPath $fakeDotNet -Value (@(
                '@echo off'
                'if /I not "%DOTNET_NOLOGO%"=="true" exit /b 81'
                'if /I not "%DOTNET_GENERATE_ASPNET_CERTIFICATE%"=="false" exit /b 82'
                'if /I not "%DOTNET_ADD_GLOBAL_TOOLS_TO_PATH%"=="false" exit /b 83'
                'echo child shutdown chatter'
                'exit /b 0'
            ) -join "`r`n")

        $originalNoLogo = [Environment]::GetEnvironmentVariable('DOTNET_NOLOGO', 'Process')
        $originalCertificate = [Environment]::GetEnvironmentVariable('DOTNET_GENERATE_ASPNET_CERTIFICATE', 'Process')
        $originalToolsPath = [Environment]::GetEnvironmentVariable('DOTNET_ADD_GLOBAL_TOOLS_TO_PATH', 'Process')

        try {
            $env:DOTNET_NOLOGO = 'parent-logo'
            $env:DOTNET_GENERATE_ASPNET_CERTIFICATE = 'parent-certificate'
            $env:DOTNET_ADD_GLOBAL_TOOLS_TO_PATH = 'parent-tools'

            $output = @(Invoke-IsolatedSdkBuildServerShutdown \
                    -DotNetPath $fakeDotNet \
                    -SdkVersion '99.0.100' 2>&1)

            ($output -join [Environment]::NewLine) | Should -Not -Match 'child shutdown chatter'
            $env:DOTNET_NOLOGO | Should -Be 'parent-logo'
            $env:DOTNET_GENERATE_ASPNET_CERTIFICATE | Should -Be 'parent-certificate'
            $env:DOTNET_ADD_GLOBAL_TOOLS_TO_PATH | Should -Be 'parent-tools'
        }
        finally {
            [Environment]::SetEnvironmentVariable('DOTNET_NOLOGO', $originalNoLogo, 'Process')
            [Environment]::SetEnvironmentVariable('DOTNET_GENERATE_ASPNET_CERTIFICATE', $originalCertificate, 'Process')
            [Environment]::SetEnvironmentVariable('DOTNET_ADD_GLOBAL_TOOLS_TO_PATH', $originalToolsPath, 'Process')
        }
    }

    It 'places blank display boundaries around the destructive warning' {
        $lines = @(Get-Content -LiteralPath $script:ToolScript)
        $warningIndex = -1
        for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -like '*Write-ToolWarning "Isolated SDK $Version will be removed from $InstallDir"*') {
                $warningIndex = $index
                break
            }
        }

        $warningIndex | Should -BeGreaterThan 0
        $lines[$warningIndex - 1].Trim() | Should -Be 'Write-ToolDisplay'
        $lines[$warningIndex + 1].Trim() | Should -Be 'Write-ToolDisplay'
    }
}
''')

          Path('tests/bash/removal-presentation.bats').write_text(r'''#!/usr/bin/env bats

setup() {
  repo_root="$(cd "$BATS_TEST_DIRNAME/../.." && pwd)"
  test_root="$(mktemp -d "${TMPDIR:-/tmp}/isolated-dotnet-sdk-removal-presentation.XXXXXX")"
  test_home="$test_root/home"
  tool_root="$test_home/dotnet-sdks"
  tool_path="$tool_root/isolated-dotnet-sdk.sh"
  mkdir -p "$tool_root"
  cp "$repo_root/isolated-dotnet-sdk.sh" "$tool_path"
  chmod +x "$tool_path"
}

teardown() {
  rm -rf "$test_root"
}

@test "removal shutdown suppresses successful child chatter and scopes first-run controls" {
  version='99.0.100'
  install_dir="$tool_root/$version"
  mkdir -p "$install_dir"
  cat > "$install_dir/dotnet" <<'EOF'
#!/usr/bin/env bash
set -euo pipefail
[[ "${DOTNET_NOLOGO:-}" == "true" ]] || exit 81
[[ "${DOTNET_GENERATE_ASPNET_CERTIFICATE:-}" == "false" ]] || exit 82
[[ "${DOTNET_ADD_GLOBAL_TOOLS_TO_PATH:-}" == "false" ]] || exit 83
printf '%s\n' 'child shutdown chatter'
EOF
  chmod +x "$install_dir/dotnet"

  run env HOME="$test_home" "$tool_path" remove "$version" --yes

  [ "$status" -eq 0 ]
  [[ "$output" != *"child shutdown chatter"* ]]
  [[ "$output" == *"Shutting down build servers for SDK $version..."* ]]
  [[ "$output" == *"Isolated SDK $version was removed."* ]]
}

@test "destructive warning has explicit blank boundaries in source" {
  warning_line="$(grep -n 'tool_warn "Isolated SDK \$VERSION will be removed from \$install_dir"' "$repo_root/isolated-dotnet-sdk.sh" | cut -d: -f1)"
  [ -n "$warning_line" ]

  previous_line="$(sed -n "$((warning_line - 1))p" "$repo_root/isolated-dotnet-sdk.sh")"
  next_line="$(sed -n "$((warning_line + 1))p" "$repo_root/isolated-dotnet-sdk.sh")"

  [[ "$previous_line" =~ ^[[:space:]]*echo[[:space:]]*$ ]]
  [[ "$next_line" =~ ^[[:space:]]*echo[[:space:]]*$ ]]
}
''')
          PY

      - name: Check parsers and diff
        shell: bash
        run: |
          bash -n isolated-dotnet-sdk.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "isolated-dotnet-sdk.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git diff --check

      - name: Commit refinement and remove harness
        shell: bash
        run: |
          rm .github/workflows/issue105-final-removal-refinement.yml
          git config user.name "Jim Scott"
          git config user.email "jscott@infoconex.com"
          git add isolated-dotnet-sdk.ps1 isolated-dotnet-sdk.sh tests/powershell/removal-presentation.Tests.ps1 tests/bash/removal-presentation.bats .github/workflows/issue105-final-removal-refinement.yml
          git commit -m "fix: quiet removal shutdown presentation"
          git push origin HEAD:release/issue-105-cli-presentation
