name: Issue 22 maintenance

on:
  push:
    branches:
      - issue-22-supply-chain-integrity
    paths:
      - .github/workflows/issue22-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Finish focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('isolated-dotnet-sdk.ps1')
          old = "$DotNetInstallBlob = '0942202517385e2c756d3b32087291c48d078713'\n"
          text = path.read_text()
          if old not in text:
              raise SystemExit('expected PowerShell blob provenance variable is missing')
          path.write_text(text.replace(old, ''))
          PY

          rm .github/workflows/issue22-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isolated-dotnet-sdk.ps1 .github/workflows/issue22-maintenance.yml
          git commit -m 'fix: keep blob IDs in provenance config only'
          git push
