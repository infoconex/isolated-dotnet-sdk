# Temporary PR-scoped real-SDK validation for Verify implementation review.
# Delete this workflow after its cross-platform evidence has been recorded.
name: Verify E2E evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash real SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check driver syntax
        run: |
          bash -n tests/e2e/bash/direct.sh
          bash -n tests/e2e/bash/interactive.sh
      - name: Run direct real SDK E2E
        run: bash tests/e2e/bash/direct.sh
      - name: Run interactive real SDK E2E
        run: bash tests/e2e/bash/interactive.sh

  powershell:
    name: PowerShell real SDK (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check driver syntax
        shell: pwsh
        run: |
          foreach ($path in @('./tests/e2e/powershell/direct.ps1', './tests/e2e/powershell/interactive.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw "Invalid PowerShell E2E driver: $path" }
          }
      - name: Run direct real SDK E2E
        shell: pwsh
        run: ./tests/e2e/powershell/direct.ps1
      - name: Run interactive real SDK E2E
        shell: pwsh
        run: ./tests/e2e/powershell/interactive.ps1
