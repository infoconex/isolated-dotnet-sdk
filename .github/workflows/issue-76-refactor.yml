name: Issue 76 Refactor Helper

on:
  push:
    branches:
      - release/issue-76-verify-health-check

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply approved-verb refactor
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('isolated-dotnet-sdk.ps1'); s=p.read_text(); assert s.count('Verify-IsolatedSdk') == 2; p.write_text(s.replace('Verify-IsolatedSdk', 'Test-IsolatedSdk'))"
          rm -f .github/workflows/issue-76-refactor.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'Jim Scott'
          git config user.email 'jscott@infoconex.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: use approved PowerShell test verb'
          git push origin HEAD:release/issue-76-verify-health-check
