name: Issue 117 list consolidation evaluation

on:
  push:
    branches:
      - issue-117-list-consolidation-evaluation
    paths:
      - .github/workflows/issue-117-evaluation.yml
      - .github/evaluation/issue-117.py
      - isolated-dotnet-sdk.ps1
      - isolated-dotnet-sdk.sh

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run List / Verify / Audit evaluation
        run: python .github/evaluation/issue-117.py --output benchmark-results/${{ runner.os }}.json

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-117-${{ runner.os }}
          path: benchmark-results/${{ runner.os }}.json
          if-no-files-found: warn
