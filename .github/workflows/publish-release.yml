name: Publish Release

on:
  pull_request:
    paths:
      - .github/workflows/publish-release.yml
      - .github/workflows/verify-release.yml
      - .github/scripts/publish-release.js
      - .github/release-notes/**
      - scripts/New-ReleaseChecksums.ps1
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish (for example, v0.2.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-definition:
    name: Validate release workflow definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm publication path is inactive
        shell: bash
        run: |
          printf '%s\n' 'Release workflow parsed successfully; publication is disabled for pull_request events.'

  publish:
    name: Publish stable release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      release_url: ${{ steps.release.outputs.release_url }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      expected_sha: ${{ steps.inputs.outputs.expected_sha }}
    env:
      RELEASE_TAG_INPUT: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify local release inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG_INPUT"
          release_tag="${release_tag#"${release_tag%%[![:space:]]*}"}"
          release_tag="${release_tag%"${release_tag##*[![:space:]]}"}"

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Stable release tag must use vMAJOR.MINOR.PATCH: %s\n' "$release_tag" >&2
            exit 1
          }

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'The workflow dispatch commit must be a full lowercase 40-character SHA.\n' >&2
            exit 1
          }

          [[ "${{ github.ref }}" == 'refs/heads/main' ]] || {
            printf 'Release publication must be dispatched from main, not %s.\n' '${{ github.ref }}' >&2
            exit 1
          }

          checkout_sha="$(git rev-parse HEAD)"
          [[ "$checkout_sha" == "$EXPECTED_SHA" ]] || {
            printf 'Checked-out SHA %s does not match dispatch SHA %s.\n' "$checkout_sha" "$EXPECTED_SHA" >&2
            exit 1
          }

          release_notes_path=".github/release-notes/${release_tag}.md"
          [[ -s "$release_notes_path" ]] || {
            printf 'Release notes were not found or are empty: %s\n' "$release_notes_path" >&2
            exit 1
          }

          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          printf 'RELEASE_NOTES_PATH=%s\n' "$release_notes_path" >> "$GITHUB_ENV"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'expected_sha=%s\n' "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify landed release state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const expectedSha = process.env.EXPECTED_SHA;
            const { owner, repo } = context.repo;

            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (mainRef.data.object.sha !== expectedSha) {
              core.setFailed(`Current main SHA ${mainRef.data.object.sha} does not match dispatch SHA ${expectedSha}.`);
              return;
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.setFailed(`Tag ${tag} already exists; refusing to replace release state.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });
            if (releases.some((release) => release.tag_name === tag)) {
              core.setFailed(`A GitHub Release for ${tag} already exists; refusing to replace release state.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              head_sha: expectedSha,
              per_page: 100
            });

            const latestPushRun = (name) => runs
              .filter((run) => run.name === name && run.event === 'push')
              .sort((left, right) => right.run_number - left.run_number)[0];

            for (const workflowName of ['Validate', 'E2E']) {
              const run = latestPushRun(workflowName);
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                const state = run ? `${run.status}/${run.conclusion ?? ''} ${run.html_url}` : 'no push run found';
                core.setFailed(`${workflowName} must have a successful completed push run for ${expectedSha}: ${state}`);
                return;
              }
              core.info(`${workflowName}: ${run.html_url}`);
            }

            const pagesRun = latestPushRun('Pages');
            if (pagesRun) {
              if (pagesRun.status !== 'completed' || pagesRun.conclusion !== 'success') {
                core.setFailed(`Pages has a run for ${expectedSha} but it is not successful: ${pagesRun.status}/${pagesRun.conclusion ?? ''} ${pagesRun.html_url}`);
                return;
              }
              core.info(`Pages: ${pagesRun.html_url}`);
            } else {
              core.info('Pages: no run exists for this SHA, so Pages is not required for publication.');
            }

      - name: Generate deterministic release checksums
        shell: pwsh
        env:
          CHECKSUM_PATH: ${{ runner.temp }}/SHA256SUMS
        run: |
          & ./scripts/New-ReleaseChecksums.ps1 `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -OutputPath $env:CHECKSUM_PATH | Out-Null

      - name: Independently verify release checksums
        id: checksums
        shell: bash
        env:
          CHECKSUM_PATH: ${{ runner.temp }}/SHA256SUMS
        run: |
          set -euo pipefail

          mapfile -t checksum_lines < "$CHECKSUM_PATH"
          [[ "${#checksum_lines[@]}" -eq 2 ]] || {
            printf 'SHA256SUMS must contain exactly two lines.\n' >&2
            exit 1
          }

          ps_hash="$(sha256sum isolated-dotnet-sdk.ps1 | awk '{print tolower($1)}')"
          sh_hash="$(sha256sum isolated-dotnet-sdk.sh | awk '{print tolower($1)}')"

          [[ "${checksum_lines[0]}" == "$ps_hash  isolated-dotnet-sdk.ps1" ]] || {
            printf 'PowerShell checksum entry does not match the checked-out release script.\n' >&2
            exit 1
          }
          [[ "${checksum_lines[1]}" == "$sh_hash  isolated-dotnet-sdk.sh" ]] || {
            printf 'Bash checksum entry does not match the checked-out release script.\n' >&2
            exit 1
          }

          [[ "$(wc -l < "$CHECKSUM_PATH" | tr -d '[:space:]')" == '2' ]] || {
            printf 'SHA256SUMS must contain exactly two newline-terminated entries.\n' >&2
            exit 1
          }

          prefix="$(od -An -tx1 -N3 "$CHECKSUM_PATH" | tr -d '[:space:]')"
          [[ "$prefix" != 'efbbbf' ]] || {
            printf 'SHA256SUMS must not contain a UTF-8 BOM.\n' >&2
            exit 1
          }

          manifest_hash="$(sha256sum "$CHECKSUM_PATH" | awk '{print tolower($1)}')"
          printf 'manifest_sha256=%s\n' "$manifest_hash" >> "$GITHUB_OUTPUT"
          printf 'powershell_sha256=%s\n' "$ps_hash" >> "$GITHUB_OUTPUT"
          printf 'bash_sha256=%s\n' "$sh_hash" >> "$GITHUB_OUTPUT"

      - name: Create, verify, and publish release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHECKSUM_PATH: ${{ runner.temp }}/SHA256SUMS
          MANIFEST_SHA256: ${{ steps.checksums.outputs.manifest_sha256 }}
          POWERSHELL_SHA256: ${{ steps.checksums.outputs.powershell_sha256 }}
          BASH_SHA256: ${{ steps.checksums.outputs.bash_sha256 }}
        with:
          script: |
            const publishRelease = require('./.github/scripts/publish-release.js');
            await publishRelease({ github, context, core });

  verify-public-release:
    name: Verify published stable release
    if: github.event_name == 'workflow_dispatch' && needs.publish.result == 'success'
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.publish.outputs.release_tag }}
