name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: write

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Bash syntax
        shell: bash
        run: bash -n isolated-dotnet-sdk.sh

      - name: Install pinned Bats-core
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.batsVersion | select(type == "string" and length > 0)' .config/test-frameworks.json)"
          commit="$(jq -er '.batsCommit | select(type == "string" and test("^[0-9a-f]{40}$"))' .config/test-frameworks.json)"
          source_dir="$RUNNER_TEMP/bats-core"
          prefix="$RUNNER_TEMP/bats"

          git -C "$RUNNER_TEMP" init bats-core
          git -C "$source_dir" remote add origin https://github.com/bats-core/bats-core.git
          git -C "$source_dir" fetch --depth=1 origin "$commit"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          "$source_dir/install.sh" "$prefix"

          test "$($prefix/bin/bats --version | awk '{print $2}')" = "$version"
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install pinned ShellCheck
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          config='.config/static-analysis.json'
          version="$(jq -er '.shellCheckVersion | select(type == "string" and length > 0)' "$config")"
          checksum="$(jq -er '.shellCheckLinuxX64Sha256 | select(type == "string" and length > 0)' "$config")"
          archive="$RUNNER_TEMP/shellcheck-v${version}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"

          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Run ShellCheck
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_home="$RUNNER_TEMP/shellcheck-home"
          mkdir -p "$shellcheck_home"
          printf 'shell=sh\n' > "$shellcheck_home/.shellcheckrc"

          HOME="$shellcheck_home" \
          SHELLCHECK_OPTS='--shell=sh' \
          bash scripts/run-shellcheck.sh

      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh

  powershell:
    name: PowerShell (windows-2025)
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './isolated-dotnet-sdk.ps1'),
              [ref]$tokens,
              [ref]$errors) | Out-Null

          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Install pinned PowerShell test and analysis modules
        shell: pwsh
        run: |
          $testConfig = Get-Content -LiteralPath './.config/test-frameworks.json' -Raw |
              ConvertFrom-Json
          $analysisConfig = Get-Content -LiteralPath './.config/static-analysis.json' -Raw |
              ConvertFrom-Json
          $pesterVersion = [string]$testConfig.pesterVersion
          $analyzerVersion = [string]$analysisConfig.psScriptAnalyzerVersion

          if ([string]::IsNullOrWhiteSpace($pesterVersion)) {
              throw 'pesterVersion is required in .config/test-frameworks.json.'
          }
          if ([string]::IsNullOrWhiteSpace($analyzerVersion)) {
              throw 'psScriptAnalyzerVersion is required in .config/static-analysis.json.'
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module `
              -Name Pester `
              -RequiredVersion $pesterVersion `
              -Scope CurrentUser `
              -Repository PSGallery `
              -Force `
              -SkipPublisherCheck
          Install-Module `
              -Name PSScriptAnalyzer `
              -RequiredVersion $analyzerVersion `
              -Scope CurrentUser `
              -Repository PSGallery `
              -Force

      - name: Apply issue 57 repair and formatting
        shell: pwsh
        run: |
          $sourcePath = './isolated-dotnet-sdk.ps1'
          $source = Get-Content -LiteralPath $sourcePath -Raw
          $source = $source -replace '(?ms)            \$SdkVersions = if \(\$ShowAllVersions\) \{\r?\n                \$AllSdkVersions\r?\n            \}\r?\n            else \{\r?\n                \$FeaturedSdkVersions\r?\n            \}', @'
            if ($ShowAllVersions) {
                $SdkVersions = @($AllSdkVersions)
            }
            else {
                $SdkVersions = @($FeaturedSdkVersions)
            }
'@
          Set-Content -LiteralPath $sourcePath -Value $source -NoNewline

          $testPath = './tests/powershell/interactive-lifecycle.Tests.ps1'
          $test = Get-Content -LiteralPath $testPath -Raw
          $test = $test.Replace(
              "'1\\. 10\\.0\\.401 \\(latest\\)'",
              "'1\\. 10\\.0\\.401 \\(latest(?:, [^)]+)*\\)'")
          Set-Content -LiteralPath $testPath -Value $test -NoNewline

          $bashPath = './isolated-dotnet-sdk.sh'
          $bash = Get-Content -LiteralPath $bashPath -Raw
          $bash = $bash.Replace(
              'if [[ -n "$current_path" && -f "$current_source" ]]; then',
              'if [[ -n "$current_path" && -f "$current_path" ]]; then')
          Set-Content -LiteralPath $bashPath -Value $bash -NoNewline

          $readmePath = './README.md'
          $readme = Get-Content -LiteralPath $readmePath -Raw
          $readme = $readme.Replace(
              'The first verified run creates `~/dotnet-sdks` if needed, saves the platform-specific tool there for future use, and then opens the interactive menu.',
              'The first verified run creates `~/dotnet-sdks` if needed, saves the platform-specific tool there for future use, and then starts a persistent interactive session. Successful operations and normal cancellations return to the main menu until you explicitly exit. Explicit Install, List, Remove, or exact-version invocations remain one-shot for automation and scripting.')
          $readme = $readme.Replace(
              'After selecting a channel, the tool lists the SDK versions published for that channel. Versions already present on the machine are marked so you can see where they are installed.',
              'After selecting a channel, the tool starts with a compact SDK list: Microsoft''s `latest-sdk` when available plus the newest SDK from each other feature band. Older servicing versions stay available through **Show all versions**. Versions already present on the machine are marked so you can see where they are installed. In a persistent interactive session, **Back** returns from SDK selection to channel selection, from channel selection to Main, and from Remove selection to Main; explicit one-shot commands keep cancellation semantics instead.')
          $readme = $readme.Replace(
              "  1. 11.0.100-rc.1.26425.128 (latest, isolated)`r`n  2. 11.0.100-preview.7.26381.103`r`n  3. 11.0.100-preview.6.26359.118",
              "  1. 11.0.100-rc.1.26425.128 (latest, isolated)`r`n`r`n  S. Show all versions`r`n  B. Back to .NET channels")
          $readme = $readme.Replace(
              'You can also choose manual entry at either picker when you already know the exact SDK version you want.',
              'You can also choose manual entry at either picker when you already know the exact SDK version you want. See [`docs/interactive-sessions.md`](docs/interactive-sessions.md) for the full persistent-session and navigation contract.')
          Set-Content -LiteralPath $readmePath -Value $readme -NoNewline

          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Write
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Commit validated repair and restore normal workflow
        shell: pwsh
        run: |
          git fetch --depth=1 origin 89cea3e7f817bf9c8cec8921a9eda3d4cdb8e870
          git checkout FETCH_HEAD -- .github/workflows/validate.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isolated-dotnet-sdk.ps1 isolated-dotnet-sdk.sh README.md tests/powershell/interactive-lifecycle.Tests.ps1 .github/workflows/validate.yml
          git commit -m 'fix: finalize interactive lifecycle behavior'
          git push origin HEAD:feat/57-interactive-menu-lifecycle
