name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

concurrency:
  # Only supersede PR validation for the same pull request.
  # Protect main/release push validation and unrelated PRs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify required validation
    if: ${{ github.event_name != 'push' || github.event.created == false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      behavioral: ${{ steps.files.outputs.behavioral }}
      documentation: ${{ steps.files.outputs.documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test classification and validation-gate policy
        shell: bash
        run: node --test tests/node/ci-validation.test.js tests/node/documentation-links.test.js
      - name: Classify changed files
        id: files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { classify } = require('./.github/scripts/classify-ci-changes.js');
            let files = [];
            let expectedCount;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100
              });
              expectedCount = context.payload.pull_request.changed_files;
            }
            const choice = classify(context.eventName, files, expectedCount);
            core.info(choice.reason);
            core.setOutput('behavioral', String(choice.behavioral));
            core.setOutput('documentation', String(choice.documentation));

  documentation:
    name: Documentation site
    needs: classify
    if: ${{ needs.classify.outputs.documentation == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown local links
        shell: bash
        run: node .github/scripts/check-documentation-links.js
      - name: Stage documentation site source
        shell: bash
        run: bash .github/scripts/prepare-pages-source.sh
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./.pages-source
          destination: ./_site
      - name: Validate generated site
        shell: bash
        run: bash .github/scripts/validate-pages-output.sh

  bash:
    needs: classify
    if: ${{ needs.classify.outputs.behavioral == 'true' }}
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned Bats-core cache
        id: bats-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/bats
          key: isolated-dotnet-sdk-bats-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/test-frameworks.json') }}

      - name: Restore pinned ShellCheck archive cache
        if: matrix.os == 'ubuntu-24.04'
        id: shellcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/shellcheck
          key: isolated-dotnet-sdk-shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/static-analysis.json') }}

      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh '${{ steps.bats-cache.outputs.cache-hit }}' '${{ steps.shellcheck-cache.outputs.cache-hit }}'

      - name: Run ShellCheck
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_home="$RUNNER_TEMP/shellcheck-home"
          mkdir -p "$shellcheck_home"
          printf 'shell=sh\n' > "$shellcheck_home/.shellcheckrc"
          HOME="$shellcheck_home" SHELLCHECK_OPTS='--shell=sh' bash scripts/run-shellcheck.sh

      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh

      - name: Run stable release publisher regression tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          node --version
          node --test tests/node/publish-release.test.js

  powershell:
    needs: classify
    if: ${{ needs.classify.outputs.behavioral == 'true' }}
    name: PowerShell (windows-2025)
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve PowerShell cache identity
        id: pwsh-cache-identity
        shell: pwsh
        run: '"version=$($PSVersionTable.PSVersion.ToString())" >> $env:GITHUB_OUTPUT'

      - name: Restore pinned PowerShell module cache
        id: powershell-module-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/powershell-modules
          key: isolated-dotnet-sdk-pwsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.pwsh-cache-identity.outputs.version }}-${{ hashFiles('.config/test-frameworks.json', '.config/static-analysis.json') }}

      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit ('${{ steps.powershell-module-cache.outputs.cache-hit }}' -eq 'true') `
              -GitHubEnvironmentFile $env:GITHUB_ENV

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


  validation-gate:
    name: Validation gate
    needs: [classify, documentation, bash, powershell]
    if: ${{ always() && (github.event_name != 'push' || github.event.created == false) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all applicable validation jobs to succeed
        shell: bash
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          BEHAVIORAL_REQUIRED: ${{ needs.classify.outputs.behavioral }}
          DOCUMENTATION_REQUIRED: ${{ needs.classify.outputs.documentation }}
          DOCS_JOB_RESULT: ${{ needs.documentation.result }}
          BASH_RESULT: ${{ needs.bash.result }}
          POWERSHELL_RESULT: ${{ needs.powershell.result }}
        run: node .github/scripts/check-validation-gate.js
