name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Bash syntax
        shell: bash
        run: bash -n isolated-dotnet-sdk.sh

      - name: Preserve file-based bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/dotnet-sdks"
          rm -f "$HOME/dotnet-sdks/isolated-dotnet-sdk.sh"

          source_copy="$RUNNER_TEMP/isolated-dotnet-sdk-source.sh"
          cp isolated-dotnet-sdk.sh "$source_copy"
          printf '\n# bootstrap-source-marker\n' >> "$source_copy"
          chmod +x "$source_copy"

          "$source_copy" list
          grep -F '# bootstrap-source-marker' "$HOME/dotnet-sdks/isolated-dotnet-sdk.sh"

      - name: Smoke test list command
        shell: bash
        run: |
          set -euo pipefail
          output="$("$HOME/dotnet-sdks/isolated-dotnet-sdk.sh" list)"
          printf '%s\n' "$output"
          grep -F "Isolated SDKs under" <<< "$output"

      - name: Reject invalid SDK version
        shell: bash
        run: |
          set -euo pipefail
          if "$HOME/dotnet-sdks/isolated-dotnet-sdk.sh" install 'invalid/version' --yes; then
            echo 'Expected invalid SDK version to fail.' >&2
            exit 1
          fi

  powershell:
    name: PowerShell (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './isolated-dotnet-sdk.ps1'),
              [ref]$tokens,
              [ref]$errors) | Out-Null

          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Preserve file-based bootstrap source
        shell: pwsh
        run: |
          $toolRoot = Join-Path $HOME 'dotnet-sdks'
          $toolPath = Join-Path $toolRoot 'isolated-dotnet-sdk.ps1'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          Remove-Item $toolPath -Force -ErrorAction SilentlyContinue

          $sourceCopy = Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-source.ps1'
          Copy-Item './isolated-dotnet-sdk.ps1' $sourceCopy -Force
          Add-Content -Path $sourceCopy -Value "`n# bootstrap-source-marker"

          & pwsh -NoProfile -File $sourceCopy -Action List
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          if (-not (Select-String -Path $toolPath -Pattern '# bootstrap-source-marker' -SimpleMatch -Quiet)) {
              Write-Error 'Installed helper did not preserve the file-based bootstrap source.'
              exit 1
          }

      - name: Smoke test list command
        shell: pwsh
        run: |
          $toolPath = Join-Path (Join-Path $HOME 'dotnet-sdks') 'isolated-dotnet-sdk.ps1'
          & pwsh -NoProfile -File $toolPath -Action List
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Reject invalid SDK version
        shell: pwsh
        run: |
          $toolPath = Join-Path (Join-Path $HOME 'dotnet-sdks') 'isolated-dotnet-sdk.ps1'
          & pwsh -NoProfile -File $toolPath -Action Install -Version 'invalid/version' -Yes
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
              Write-Error 'Expected invalid SDK version to fail.'
              exit 1
          }

          exit 0
