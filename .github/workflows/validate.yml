name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Bash syntax
        shell: bash
        run: bash -n isolated-dotnet-sdk.sh

      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh

  powershell:
    name: PowerShell (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './isolated-dotnet-sdk.ps1'),
              [ref]$tokens,
              [ref]$errors) | Out-Null

          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
