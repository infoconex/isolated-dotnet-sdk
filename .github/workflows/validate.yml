name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

concurrency:
  # Only supersede PR validation for the same pull request.
  # Protect main/release push validation and unrelated PRs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bash:
    if: ${{ github.event_name != 'push' || github.event.created == false }}
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned Bats-core cache
        id: bats-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/bats
          key: isolated-dotnet-sdk-bats-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/test-frameworks.json') }}

      - name: Restore pinned ShellCheck archive cache
        if: matrix.os == 'ubuntu-24.04'
        id: shellcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/shellcheck
          key: isolated-dotnet-sdk-shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/static-analysis.json') }}

      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh '${{ steps.bats-cache.outputs.cache-hit }}' '${{ steps.shellcheck-cache.outputs.cache-hit }}'

      - name: Run ShellCheck
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_home="$RUNNER_TEMP/shellcheck-home"
          mkdir -p "$shellcheck_home"
          printf 'shell=sh\n' > "$shellcheck_home/.shellcheckrc"
          HOME="$shellcheck_home" SHELLCHECK_OPTS='--shell=sh' bash scripts/run-shellcheck.sh

      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh

      - name: Run stable release publisher regression tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          node --version
          node --test tests/node/publish-release.test.js

  powershell:
    if: ${{ github.event_name != 'push' || github.event.created == false }}
    name: PowerShell (windows-2025)
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve PowerShell cache identity
        id: pwsh-cache-identity
        shell: pwsh
        run: '"version=$($PSVersionTable.PSVersion.ToString())" >> $env:GITHUB_OUTPUT'

      - name: Restore pinned PowerShell module cache
        id: powershell-module-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/powershell-modules
          key: isolated-dotnet-sdk-pwsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.pwsh-cache-identity.outputs.version }}-${{ hashFiles('.config/test-frameworks.json', '.config/static-analysis.json') }}

      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit ('${{ steps.powershell-module-cache.outputs.cache-hit }}' -eq 'true') `
              -GitHubEnvironmentFile $env:GITHUB_ENV

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Diagnostic-only formatting export: commit the canonical result and remove
      # this one-time step after inspecting the artifact.
      - name: Prepare canonical formatting for SDK timing diagnostics
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload canonical formatter result for SDK profiler
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue181-canonical-format
          path: isolated-dotnet-sdk.ps1
          retention-days: 2
      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Issue 181 investigative branch only; remove before review.
      - name: Smoke test experimental Verify stack profiler
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1 -Suite Verify -TraceVerifyStack
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Temporary first-execution control for diagnostic branch only.
      - name: Smoke test parent first fake host execution
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1 -Suite Verify -TraceVerifyStack -TraceVerifyPrewarmHost
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Temporary opt-in suite-wide timing pass on this diagnostic PR only.
      - name: Profile all PowerShell behavioral tests (experimental)
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1 -Suite All -TraceAll
          $testExitCode = $LASTEXITCODE
          # The runner stores profiling ZIPs in a unique TEMP directory and
          # prints the path. Preserve the latest completed one before checkout
          # cleanup; upload it even if the profiled tests report a failure.
          $profileZip = Get-ChildItem -Path $env:TEMP -Filter 'isolated-dotnet-sdk-verify-trace-*.zip' -File |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
          if ($null -ne $profileZip) {
              $artifactRoot = Join-Path $env:RUNNER_TEMP 'issue181-profile-artifact'
              New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
              Copy-Item -LiteralPath $profileZip.FullName -Destination (Join-Path $artifactRoot 'all-suite-profile.zip') -Force
              Write-Output "Saved CI profiler artifact: $artifactRoot"
          }
          else {
              Write-Warning 'No complete profiler ZIP was produced by the diagnostic runner.'
          }
          if ($testExitCode -ne 0) {
              exit $testExitCode
          }

      - name: Upload opt-in PowerShell profile
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue181-powershell-profile
          path: ${{ runner.temp }}/issue181-profile-artifact/all-suite-profile.zip
          if-no-files-found: warn
          retention-days: 5

      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Branch-only Issue #181 pilot, never included in stable release workflow.
      - name: Benchmark sequential vs 2/4 isolated Pester workers
        if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        shell: pwsh
        timeout-minutes: 30
        run: |
          & pwsh -NoProfile -File ./tests/powershell/Invoke-Issue181ParallelPilot.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'issue181-parallel-pilot')
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Upload Issue 181 parallel pilot results
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'diagnostics/181-verify-step-profile'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue181-parallel-benchmark
          path: ${{ runner.temp }}/issue181-parallel-pilot/
          if-no-files-found: warn
          retention-days: 5
