name: Replace SVG quick start with text

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/docs-text-quickstart.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation

      - name: Replace SVG examples with text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          replacements = [
              (
                  '## Visual Quick Start — Isolation in Practice\n\nThe install and direct-host visuals below use the supported Linux/Bash mapping and are aligned with the current real-E2E flow. CI-only home-directory prefixes and timestamps are normalized so the isolated root is readable as `~/dotnet-sdks`. The List visual is a representative ownership example because the SDKs visible through the normal system `dotnet` host vary by machine and runner image. Windows uses PowerShell and `dotnet.exe`, while macOS uses Bash. See [`docs/cross-platform-support.md`](docs/cross-platform-support.md) for the supported platform mapping.',
                  '## Isolation in Practice\n\nThe examples below use the supported Linux/Bash mapping and are aligned with the current real-E2E flow. CI-only home-directory prefixes and timestamps are normalized so the isolated root is readable as `~/dotnet-sdks`. The List output is representative because the SDKs visible through the normal system `dotnet` host vary by machine and runner image. Windows uses PowerShell and `dotnet.exe`, while macOS uses Bash. See [`docs/cross-platform-support.md`](docs/cross-platform-support.md) for the supported platform mapping.'
              ),
              (
                  '![Representative Linux Bash install transcript aligned with the real E2E target, showing .NET SDK 10.0.100 installed successfully under ~/dotnet-sdks/10.0.100.](docs/images/isolation-install.svg)',
                  '''Representative output:\n\n```text\nTarget SDK: 10.0.100\nIsolated install directory: ~/dotnet-sdks/10.0.100\n\nChecking existing installations...\n\nIsolated SDK: Not installed\n\nSystem SDK: Not installed\n\nLoading Microsoft release metadata for SDK 10.0.100...\nDownloading .NET SDK 10.0.100 payload...\nExtracting verified .NET SDK 10.0.100 payload...\n\nVerifying the isolated SDK...\n\nIsolated SDK installation completed successfully.\nLocation: ~/dotnet-sdks/10.0.100\n```'''
              ),
              (
                  '![Representative Linux Bash installed-SDK listing showing Isolated and System ownership groups with concrete version directories, including the same SDK version in both domains.](docs/images/isolation-list.svg)',
                  '''Representative output:\n\n```text\nInstalled .NET SDKs\n\nIsolated SDKs:\n  10.0.100  ~/dotnet-sdks/10.0.100\n\nSystem SDKs:\n  10.0.100  /usr/share/dotnet/sdk/10.0.100\n```'''
              ),
              (
                  '''```bash\n"$HOME/dotnet-sdks/10.0.100/dotnet" --info\n```\n\nThe E2E check uses `--version` for a compact assertion that this exact version-specific host reports `10.0.100`; normal `dotnet` arguments such as `--info` work through the same host path.\n\n![Linux Bash real E2E direct-host check showing ~/dotnet-sdks/10.0.100/dotnet reporting version 10.0.100.](docs/images/isolation-direct-host.svg)''',
                  '''```bash\n"$HOME/dotnet-sdks/10.0.100/dotnet" --version\n```\n\nExpected output:\n\n```text\n10.0.100\n```\n\nThe E2E check uses `--version` for this compact assertion; normal `dotnet` arguments such as `--info` work through the same version-specific host path.'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm docs/images/isolation-install.svg
          rm docs/images/isolation-list.svg
          rm docs/images/isolation-direct-host.svg

          if git grep -n -E '\.svg|docs/images/' -- README.md docs; then
            echo 'Unexpected SVG reference remains.' >&2
            exit 1
          fi

          git diff --check

      - name: Commit text examples and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/docs-text-quickstart.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: replace SVG quick start with text examples'
          git push origin HEAD:release/issue-105-cli-presentation
