name: Issue 22 maintenance runner

on:
  push:
    branches:
      - issue-22-supply-chain-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-22-supply-chain-integrity

      - name: Apply staged cleanup
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin issue-22-supply-chain-integrity
          python3 scripts/Issue22Finalize.py
          rm -f scripts/Issue22Finalize.py
          rm -f .github/workflows/issue22-final-maintenance.yml
          rm -f .github/workflows/issue22-fixture-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align integrity fixtures and stable bootstrap docs'
          git push origin HEAD:issue-22-supply-chain-integrity
