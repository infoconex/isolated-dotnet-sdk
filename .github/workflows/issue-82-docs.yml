name: Apply Issue 82 documentation update

on:
  push:
    branches:
      - release/issue-82-s-channel-toggle

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-82-s-channel-toggle

      - name: Update README channel toggle example
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = '  A. Show end-of-life channels'
          new = '  S. Show end-of-life channels'
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new))
          elif count == 0:
              assert text.count(new) >= 1
          else:
              raise SystemExit(f'unexpected README match count: {count}')
          PY
          git diff --check
          git diff -- README.md

      - name: Commit documentation when needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo 'Documentation already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update channel toggle example'
          git push origin HEAD:release/issue-82-s-channel-toggle
