name: E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bash:
    name: Bash E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Bash E2E driver syntax
        shell: bash
        run: |
          bash -n tests/e2e/bash/latest-stable-bootstrap.sh
          bash -n tests/e2e/bash/direct.sh
          bash -n tests/e2e/bash/interactive.sh

      - name: Run latest-stable bootstrap real E2E
        shell: bash
        run: bash tests/e2e/bash/latest-stable-bootstrap.sh

      - name: Run direct-command real E2E
        shell: bash
        run: bash tests/e2e/bash/direct.sh

      - name: Run interactive real E2E
        shell: bash
        run: bash tests/e2e/bash/interactive.sh

  powershell:
    name: PowerShell E2E (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PowerShell E2E driver syntax
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @(
              './tests/e2e/powershell/latest-stable-bootstrap.ps1',
              './tests/e2e/powershell/direct.ps1',
              './tests/e2e/powershell/interactive.ps1')) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $path),
                  [ref]$tokens,
                  [ref]$parseErrors) | Out-Null
              $errors += $parseErrors
          }

          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Run latest-stable bootstrap real E2E
        shell: pwsh
        run: ./tests/e2e/powershell/latest-stable-bootstrap.ps1

      - name: Run direct-command real E2E
        shell: pwsh
        run: ./tests/e2e/powershell/direct.ps1

      - name: Run interactive real E2E
        shell: pwsh
        run: ./tests/e2e/powershell/interactive.ps1
