name: Issue 116 GREEN

on:
  push:
    branches:
      - issue-116-sdk-audit
    paths:
      - .github/workflows/issue-116-red.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
      - name: Apply Audit implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected at least one match in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          ps = 'isolated-dotnet-sdk.ps1'
          replace_once(ps,
              'Supported product actions are Install, Remove, List, and Verify.',
              'Supported product actions are Install, Remove, List, Verify, and Audit. Audit is an explicit online, read-only lifecycle and servicing assessment for installed Isolated and System SDKs.')
          replace_once(ps,
              'Specifies the operation to perform: Install, Remove, List, or Verify.',
              'Specifies the operation to perform: Install, Remove, List, Verify, or Audit.')
          replace_once(ps,
              'Direct Verify requires SdkVersion; interactive Verify selects from installed isolated SDKs. SdkVersion is invalid with an explicit List action.',
              'Direct Verify requires SdkVersion; interactive Verify selects from installed isolated SDKs. SdkVersion is invalid with explicit List or Audit actions.')
          replace_once(ps,
              "    if ($script:Action -notin @('Install', 'Remove', 'List', 'Verify')) {",
              "    if ($script:Action -notin @('Install', 'Remove', 'List', 'Verify', 'Audit')) {")
          replace_once(ps,
              "        Write-ToolDisplay '  V. Verify an isolated SDK'\n        Write-ToolDisplay\n        Write-ToolDisplay '  E. Exit'",
              "        Write-ToolDisplay '  V. Verify an isolated SDK'\n        Write-ToolDisplay '  A. Audit installed SDKs'\n        Write-ToolDisplay\n        Write-ToolDisplay '  E. Exit'")
          replace_once(ps,
              "            'V' { $script:Action = 'Verify'; return $true }\n            'e' { Write-ToolExit; return $false }",
              "            'V' { $script:Action = 'Verify'; return $true }\n            'a' { $script:Action = 'Audit'; return $true }\n            'A' { $script:Action = 'Audit'; return $true }\n            'e' { Write-ToolExit; return $false }")
          replace_once(ps,
              "Write-InvalidSelection -Selection $Selection -Choices 'Choose I, R, L, V, or E.'",
              "Write-InvalidSelection -Selection $Selection -Choices 'Choose I, R, L, V, A, or E.'")
          replace_once(ps,
              "    if ($script:Action -eq 'List' -and $script:SdkVersionWasSpecified) {\n        throw '-SdkVersion is supported only with -Action Install, Remove, or Verify.'\n    }",
              "    if ($script:Action -in @('List', 'Audit') -and $script:SdkVersionWasSpecified) {\n        throw '-SdkVersion is supported only with -Action Install, Remove, or Verify.'\n    }")

          audit_ps = r'''
function Get-SdkChannelFromVersion {
    param([string]$Version)

    $Match = [regex]::Match($Version, '^(?<major>[0-9]+)\.(?<minor>[0-9]+)\.')
    if (-not $Match.Success) {
        return $null
    }

    return "$($Match.Groups['major'].Value).$($Match.Groups['minor'].Value)"
}

function Compare-SdkVersion {
    param(
        [string]$Left,
        [string]$Right
    )

    return [string]::CompareOrdinal(
        (Get-SdkVersionSortKey $Left),
        (Get-SdkVersionSortKey $Right))
}

function Get-ReleaseSdkVersion {
    param($Release)

    $Versions = [System.Collections.Generic.List[string]]::new()
    $Seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)

    if ($Release.sdk -and -not [string]::IsNullOrWhiteSpace([string]$Release.sdk.version)) {
        $Version = [string]$Release.sdk.version
        if ($Seen.Add($Version)) {
            $Versions.Add($Version)
        }
    }

    foreach ($Sdk in @($Release.sdks)) {
        if ($Sdk -and -not [string]::IsNullOrWhiteSpace([string]$Sdk.version)) {
            $Version = [string]$Sdk.version
            if ($Seen.Add($Version)) {
                $Versions.Add($Version)
            }
        }
    }

    return @($Versions)
}

function Test-SecurityUpdateAvailable {
    param(
        $ChannelMetadata,
        [string]$InstalledVersion
    )

    $KnownVersions = @(Get-ChannelSdkVersion $ChannelMetadata)
    if ($KnownVersions -notcontains $InstalledVersion) {
        return $false
    }

    foreach ($Release in @($ChannelMetadata.releases)) {
        if ($Release.security -ne $true) {
            continue
        }

        foreach ($Version in @(Get-ReleaseSdkVersion $Release)) {
            if ((Compare-SdkVersion -Left $Version -Right $InstalledVersion) -gt 0) {
                return $true
            }
        }
    }

    return $false
}

function Get-AuditLifecycleLabel {
    param([string]$SupportPhase)

    switch ($SupportPhase) {
        'active' { return '' }
        'maintenance' { return 'Maintenance' }
        'preview' { return 'Preview' }
        'go-live' { return 'Go Live' }
        'eol' { return 'End of life' }
        default { return 'Unsupported' }
    }
}

function Get-SdkAuditStatus {
    param(
        [string]$Version,
        $ChannelEntry,
        $ChannelMetadata
    )

    $SupportPhase = [string]$ChannelEntry.'support-phase'
    $LatestSdk = [string]$ChannelEntry.'latest-sdk'
    $Lifecycle = Get-AuditLifecycleLabel -SupportPhase $SupportPhase

    if ($SupportPhase -eq 'eol') {
        return 'End of life'
    }

    $Comparison = Compare-SdkVersion -Left $Version -Right $LatestSdk
    if ($Comparison -gt 0) {
        $Servicing = 'Newer than known metadata'
    }
    elseif ($Comparison -eq 0) {
        $Servicing = 'Current'
    }
    else {
        $Servicing = "Update available -> $LatestSdk"
        $IsPrerelease = $Version.Contains('-') -or $SupportPhase -eq 'preview'
        if (-not $IsPrerelease -and
            (Test-SecurityUpdateAvailable -ChannelMetadata $ChannelMetadata -InstalledVersion $Version)) {
            $Servicing = "Security update available -> $LatestSdk"
        }
    }

    if ($Servicing -eq 'Current' -and -not [string]::IsNullOrWhiteSpace($Lifecycle)) {
        return $Lifecycle
    }

    if (-not [string]::IsNullOrWhiteSpace($Lifecycle)) {
        return "$Servicing  $Lifecycle"
    }

    return $Servicing
}

function Get-AuditChannelMetadata {
    param(
        [string]$ChannelVersion,
        [string]$MetadataUrl,
        [hashtable]$Cache
    )

    if ($Cache.ContainsKey($ChannelVersion)) {
        return $Cache[$ChannelVersion]
    }

    try {
        $Metadata = Invoke-RestMethod -Uri $MetadataUrl
    }
    catch {
        throw "Unable to load release metadata for .NET $ChannelVersion."
    }

    if ($null -eq $Metadata -or $null -eq $Metadata.releases) {
        throw "Invalid release metadata for .NET $ChannelVersion."
    }

    $Versions = @(Get-ChannelSdkVersion $Metadata)
    if (-not $Versions) {
        throw "Invalid release metadata for .NET $ChannelVersion."
    }

    $Cache[$ChannelVersion] = $Metadata
    return $Metadata
}

function Invoke-SdkAudit {
    $IsolatedVersions = @(Get-IsolatedSdkVersion)
    $SystemSdks = @(Get-SystemSdkInventory)

    if (-not $IsolatedVersions -and -not $SystemSdks) {
        Write-ToolHeading '.NET SDK audit'
        Write-ToolDisplay
        Write-ToolHeading 'Isolated SDKs:'
        Write-ToolDisplay '  None'
        Write-ToolDisplay
        Write-ToolHeading 'System SDKs:'
        Write-ToolDisplay '  None'
        return
    }

    $ReleaseIndex = Get-ReleaseIndex
    $ChannelEntries = @{}
    foreach ($Entry in @($ReleaseIndex.'releases-index')) {
        $ChannelVersion = [string]$Entry.'channel-version'
        if (-not [string]::IsNullOrWhiteSpace($ChannelVersion) -and
            -not $ChannelEntries.ContainsKey($ChannelVersion)) {
            $ChannelEntries[$ChannelVersion] = $Entry
        }
    }

    $MetadataCache = @{}
    $StatusByVersion = @{}
    $AllVersions = @($IsolatedVersions) + @($SystemSdks | ForEach-Object { $_.Version })
    foreach ($Version in @($AllVersions | Select-Object -Unique)) {
        $ChannelVersion = Get-SdkChannelFromVersion -Version $Version
        if ([string]::IsNullOrWhiteSpace($ChannelVersion) -or
            -not $ChannelEntries.ContainsKey($ChannelVersion)) {
            $StatusByVersion[$Version] = 'Unknown channel'
            continue
        }

        $Entry = $ChannelEntries[$ChannelVersion]
        $LatestSdk = [string]$Entry.'latest-sdk'
        $SupportPhase = [string]$Entry.'support-phase'
        $MetadataUrl = [string]$Entry.'releases.json'
        if ([string]::IsNullOrWhiteSpace($LatestSdk) -or
            [string]::IsNullOrWhiteSpace($SupportPhase) -or
            [string]::IsNullOrWhiteSpace($MetadataUrl)) {
            throw "Invalid .NET release metadata for .NET $ChannelVersion."
        }

        $ChannelMetadata = Get-AuditChannelMetadata `
            -ChannelVersion $ChannelVersion `
            -MetadataUrl $MetadataUrl `
            -Cache $MetadataCache
        if (@(Get-ChannelSdkVersion $ChannelMetadata) -notcontains $LatestSdk) {
            throw "Invalid release metadata for .NET $ChannelVersion."
        }

        $StatusByVersion[$Version] = Get-SdkAuditStatus `
            -Version $Version `
            -ChannelEntry $Entry `
            -ChannelMetadata $ChannelMetadata
    }

    Write-ToolHeading '.NET SDK audit'
    Write-ToolDisplay
    Write-ToolHeading 'Isolated SDKs:'
    if (-not $IsolatedVersions) {
        Write-ToolDisplay '  None'
    }
    else {
        foreach ($Version in $IsolatedVersions) {
            Write-ToolDisplay "  $Version  $($StatusByVersion[$Version])"
        }
    }

    Write-ToolDisplay
    Write-ToolHeading 'System SDKs:'
    if (-not $SystemSdks) {
        Write-ToolDisplay '  None'
    }
    else {
        foreach ($Sdk in $SystemSdks) {
            Write-ToolDisplay "  $($Sdk.Version)  $($StatusByVersion[$Sdk.Version])"
        }
    }
}

'''
          replace_once(ps, 'function Read-ManualVersion {', audit_ps + 'function Read-ManualVersion {')
          replace_once(ps,
              "        'List' { Show-InstalledSdk }\n        'Verify' {",
              "        'List' { Show-InstalledSdk }\n        'Audit' { Invoke-SdkAudit }\n        'Verify' {")

          sh = 'isolated-dotnet-sdk.sh'
          old_parser = r'''parse_release_index() {
    awk '
        /"channel-version"[[:space:]]*:/ {
            channel=$0
            sub(/^[^:]*:[[:space:]]*"/, "", channel)
            sub(/".*$/, "", channel)
        }
        /"latest-sdk"[[:space:]]*:/ {
            latest=$0
            sub(/^[^:]*:[[:space:]]*"/, "", latest)
            sub(/".*$/, "", latest)
        }
        /"support-phase"[[:space:]]*:/ {
            phase=$0
            sub(/^[^:]*:[[:space:]]*"/, "", phase)
            sub(/".*$/, "", phase)
        }
        /"release-type"[[:space:]]*:/ {
            type=$0
            sub(/^[^:]*:[[:space:]]*"/, "", type)
            sub(/".*$/, "", type)
        }
        /"releases.json"[[:space:]]*:/ {
            url=$0
            sub(/^[^:]*:[[:space:]]*"/, "", url)
            sub(/".*$/, "", url)
            if (channel != "" && phase != "" && url != "") {
                print channel "|" latest "|" phase "|" type "|" url
            }
            channel=latest=phase=type=url=""
        }
    '
}'''
          new_parser = r'''parse_release_index() {
    awk '
        function json_string(line, key, marker, value) {
            marker = "\\\"" key "\\\"[[:space:]]*:[[:space:]]*\\\""
            if (!match(line, marker)) {
                return ""
            }
            value = substr(line, RSTART + RLENGTH)
            sub(/".*$/, "", value)
            return value
        }
        {
            value = json_string($0, "channel-version")
            if (value != "") channel=value
            value = json_string($0, "latest-sdk")
            if (value != "") latest=value
            value = json_string($0, "support-phase")
            if (value != "") phase=value
            value = json_string($0, "release-type")
            if (value != "") type=value
            value = json_string($0, "releases.json")
            if (value != "") {
                url=value
                if (channel != "" && phase != "" && url != "") {
                    print channel "|" latest "|" phase "|" type "|" url
                }
                channel=latest=phase=type=url=""
            }
        }
    '
}'''
          replace_once(sh, old_parser, new_parser)

          audit_sh = r'''
extract_security_sdk_versions() {
    awk '
        /"release-date"[[:space:]]*:/ { security="false" }
        /"security"[[:space:]]*:[[:space:]]*true/ { security="true" }
        /"security"[[:space:]]*:[[:space:]]*false/ { security="false" }
        {
            if (security != "true") next
            line=$0
            while (match(line, /\/dotnet\/Sdk\/[^\/"[:space:]]+/)) {
                version=substr(line, RSTART, RLENGTH)
                sub(/^.*\/Sdk\//, "", version)
                if (!seen[version]++) print version
                line=substr(line, RSTART + RLENGTH)
            }
        }
    '
}

sdk_channel_from_version() {
    local version="$1"
    local core="${version%%-*}"
    local major=""
    local minor=""
    local rest=""

    IFS='.' read -r major minor rest <<< "$core"
    if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
        return 1
    fi

    printf '%s.%s' "$major" "$minor"
}

compare_sdk_versions() {
    local left_key
    local right_key
    left_key="$(sdk_version_sort_key "$1")"
    right_key="$(sdk_version_sort_key "$2")"

    if [[ "$left_key" == "$right_key" ]]; then
        printf '0'
    elif LC_ALL=C [[ "$left_key" > "$right_key" ]]; then
        printf '1'
    else
        printf '%s' '-1'
    fi
}

audit_lifecycle_label() {
    case "$1" in
        active) printf '%s' '' ;;
        maintenance) printf '%s' 'Maintenance' ;;
        preview) printf '%s' 'Preview' ;;
        go-live) printf '%s' 'Go Live' ;;
        eol) printf '%s' 'End of life' ;;
        *) printf '%s' 'Unsupported' ;;
    esac
}

AUDIT_METADATA_CHANNELS=()
AUDIT_METADATA_VALUES=()
AUDIT_METADATA_RESULT=""
AUDIT_STATUS=""

load_audit_channel_metadata() {
    local channel="$1"
    local url="$2"
    local i
    local metadata=""
    local versions=""

    for ((i=0; i<${#AUDIT_METADATA_CHANNELS[@]}; i++)); do
        if [[ "${AUDIT_METADATA_CHANNELS[$i]}" == "$channel" ]]; then
            AUDIT_METADATA_RESULT="${AUDIT_METADATA_VALUES[$i]}"
            return
        fi
    done

    if ! metadata="$(curl -fsSL "$url")"; then
        tool_fail "Unable to load release metadata for .NET $channel."
    fi
    if ! looks_like_json_object "$metadata" || [[ "$metadata" != *'"releases"'* ]]; then
        tool_fail "Invalid release metadata for .NET $channel."
    fi
    versions="$(printf '%s\n' "$metadata" | extract_sdk_versions || true)"
    [[ -n "$versions" ]] || tool_fail "Invalid release metadata for .NET $channel."

    AUDIT_METADATA_CHANNELS+=("$channel")
    AUDIT_METADATA_VALUES+=("$metadata")
    AUDIT_METADATA_RESULT="$metadata"
}

resolve_audit_status() {
    local version="$1"
    local channel_data="$2"
    local channel=""
    local found="false"
    local latest_sdk=""
    local phase=""
    local release_type=""
    local releases_url=""
    local row_channel=""
    local metadata=""
    local versions=""
    local security_versions=""
    local security_version=""
    local comparison=0
    local servicing=""
    local lifecycle=""

    if ! channel="$(sdk_channel_from_version "$version")"; then
        AUDIT_STATUS="Unknown channel"
        return
    fi

    while IFS='|' read -r row_channel latest_sdk phase release_type releases_url; do
        if [[ "$row_channel" == "$channel" ]]; then
            found="true"
            break
        fi
    done <<< "$channel_data"

    if [[ "$found" != "true" ]]; then
        AUDIT_STATUS="Unknown channel"
        return
    fi
    if [[ -z "$latest_sdk" || -z "$phase" || -z "$releases_url" ]]; then
        tool_fail "Invalid .NET release metadata for .NET $channel."
    fi

    load_audit_channel_metadata "$channel" "$releases_url"
    metadata="$AUDIT_METADATA_RESULT"
    versions="$(printf '%s\n' "$metadata" | extract_sdk_versions || true)"
    contains_line "$versions" "$latest_sdk" || tool_fail "Invalid release metadata for .NET $channel."

    if [[ "$phase" == "eol" ]]; then
        AUDIT_STATUS="End of life"
        return
    fi

    comparison="$(compare_sdk_versions "$version" "$latest_sdk")"
    if (( comparison > 0 )); then
        servicing="Newer than known metadata"
    elif (( comparison == 0 )); then
        servicing="Current"
    else
        servicing="Update available -> $latest_sdk"
        if [[ "$phase" != "preview" && "$version" != *-* ]] && contains_line "$versions" "$version"; then
            security_versions="$(printf '%s\n' "$metadata" | extract_security_sdk_versions || true)"
            while IFS= read -r security_version; do
                [[ -n "$security_version" ]] || continue
                if (( $(compare_sdk_versions "$security_version" "$version") > 0 )); then
                    servicing="Security update available -> $latest_sdk"
                    break
                fi
            done <<< "$security_versions"
        fi
    fi

    lifecycle="$(audit_lifecycle_label "$phase")"
    if [[ "$servicing" == "Current" && -n "$lifecycle" ]]; then
        AUDIT_STATUS="$lifecycle"
    elif [[ -n "$lifecycle" ]]; then
        AUDIT_STATUS="$servicing  $lifecycle"
    else
        AUDIT_STATUS="$servicing"
    fi
}

audit_installed_sdks() {
    local isolated_output=""
    local system_output=""
    local index_json=""
    local channel_data=""
    local line=""
    local version=""
    local i=0
    local isolated_versions=()
    local system_versions=()
    local isolated_statuses=()
    local system_statuses=()

    isolated_output="$(get_isolated_sdk_versions)"
    system_output="$(get_system_sdk_inventory)"

    while IFS= read -r line; do
        [[ -n "$line" ]] && isolated_versions+=("$line")
    done <<< "$isolated_output"
    while IFS= read -r line; do
        [[ -n "$line" ]] || continue
        version="${line%%[[:space:]]*}"
        system_versions+=("$version")
    done <<< "$system_output"

    if (( ${#isolated_versions[@]} == 0 && ${#system_versions[@]} == 0 )); then
        tool_heading ".NET SDK audit"
        echo
        tool_heading "Isolated SDKs:"
        echo "  None"
        echo
        tool_heading "System SDKs:"
        echo "  None"
        return
    fi

    tool_info "Loading available .NET SDK releases from Microsoft..."
    index_json="$(curl -fsSL "$RELEASE_INDEX_URL")" || \
        tool_fail "Unable to load .NET release metadata from Microsoft."
    if ! looks_like_json_object "$index_json" || [[ "$index_json" != *'"releases-index"'* ]]; then
        tool_fail "Invalid .NET release metadata from Microsoft."
    fi
    channel_data="$(printf '%s\n' "$index_json" | parse_release_index)"
    [[ -n "$channel_data" ]] || tool_fail "Invalid .NET release metadata from Microsoft."

    AUDIT_METADATA_CHANNELS=()
    AUDIT_METADATA_VALUES=()
    for version in "${isolated_versions[@]}"; do
        resolve_audit_status "$version" "$channel_data"
        isolated_statuses+=("$AUDIT_STATUS")
    done
    for version in "${system_versions[@]}"; do
        resolve_audit_status "$version" "$channel_data"
        system_statuses+=("$AUDIT_STATUS")
    done

    tool_heading ".NET SDK audit"
    echo
    tool_heading "Isolated SDKs:"
    if (( ${#isolated_versions[@]} == 0 )); then
        echo "  None"
    else
        for ((i=0; i<${#isolated_versions[@]}; i++)); do
            printf '  %s  %s\n' "${isolated_versions[$i]}" "${isolated_statuses[$i]}"
        done
    fi

    echo
    tool_heading "System SDKs:"
    if (( ${#system_versions[@]} == 0 )); then
        echo "  None"
    else
        for ((i=0; i<${#system_versions[@]}; i++)); do
            printf '  %s  %s\n' "${system_versions[$i]}" "${system_statuses[$i]}"
        done
    fi
}

'''
          replace_once(sh, 'select_action() {', audit_sh + 'select_action() {')
          replace_once(sh,
              '        echo "  V. Verify an isolated SDK"\n        echo\n        echo "  E. Exit"',
              '        echo "  V. Verify an isolated SDK"\n        echo "  A. Audit installed SDKs"\n        echo\n        echo "  E. Exit"')
          replace_once(sh,
              '            v|V) ACTION="verify"; return 0 ;;\n            e|E) tool_exit; return 1 ;;',
              '            v|V) ACTION="verify"; return 0 ;;\n            a|A) ACTION="audit"; return 0 ;;\n            e|E) tool_exit; return 1 ;;')
          replace_once(sh,
              'warn_invalid_selection "$selection" "Choose I, R, L, V, or E."',
              'warn_invalid_selection "$selection" "Choose I, R, L, V, A, or E."')
          replace_once(sh,
              '        verify)\n            if [[ "$INTERACTIVE_SESSION" == "true" && -z "$VERSION" ]]; then',
              '        audit)\n            audit_installed_sdks\n            ;;\n        verify)\n            if [[ "$INTERACTIVE_SESSION" == "true" && -z "$VERSION" ]]; then')
          replace_once(sh,
              '  isolated-dotnet-sdk.sh verify <version>\n  isolated-dotnet-sdk.sh --sdk-version',
              '  isolated-dotnet-sdk.sh verify <version>\n  isolated-dotnet-sdk.sh audit\n  isolated-dotnet-sdk.sh --sdk-version')
          replace_once(sh,
              '  verify <version>   Read-only health check for one exact installed isolated SDK.\n',
              '  verify <version>   Read-only health check for one exact installed isolated SDK.\n  audit              Online read-only lifecycle and servicing assessment for installed SDKs.\n')
          replace_once(sh,
              '  Interactive Verify selects one installed isolated SDK and runs the same read-only health check.\n',
              '  Interactive Verify selects one installed isolated SDK and runs the same read-only health check.\n  Audit              Uses current Microsoft release metadata for Isolated and System SDKs without changing them.\n')
          replace_once(sh,
              '        install|remove|list|verify)',
              '        install|remove|list|verify|audit)')
          replace_once(sh,
              'if [[ "$ACTION" == "list" && -n "$VERSION" ]]; then\n    tool_fail "An SDK version cannot be combined with list."\nfi',
              'if [[ "$ACTION" == "list" && -n "$VERSION" ]]; then\n    tool_fail "An SDK version cannot be combined with list."\nfi\n\nif [[ "$ACTION" == "audit" && -n "$VERSION" ]]; then\n    tool_fail "An SDK version cannot be combined with audit."\nfi')

          for path in [
              'tests/bash/interactive-lifecycle.bats',
              'tests/bash/global-exit.bats',
              'tests/powershell/interactive-lifecycle.Tests.ps1',
              'tests/powershell/global-exit.Tests.ps1',
          ]:
              replace_all(path, 'Choose I, R, L, V, or E.', 'Choose I, R, L, V, A, or E.')
              replace_all(path, 'Choose I, R, L, V, or E\\.', 'Choose I, R, L, V, A, or E\\.') if 'powershell' in path and 'Choose I, R, L, V, or E\\.' in Path(path).read_text() else None

          Path('.github/workflows/issue-116-red.yml').unlink()
          PY
      - name: Prepare Bash validation tooling
        shell: bash
        run: bash scripts/initialize-bash-validation.sh false false
      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -LiteralPath ./isolated-dotnet-sdk.ps1 -Raw)) | Out-Null'
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add SDK lifecycle audit' -m 'Refs #116'
          git push origin HEAD:issue-116-sdk-audit

  powershell-green:
    needs: implement
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-116-sdk-audit
      - name: Prepare PowerShell validation tooling
        shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit $false `
              -GitHubEnvironmentFile $env:GITHUB_ENV
      - name: Run PowerShell static analysis
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
