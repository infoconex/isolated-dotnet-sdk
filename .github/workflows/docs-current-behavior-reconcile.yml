name: Reconcile current behavior documentation

on:
  push:
    branches:
      - release/issue-105-cli-presentation
    paths:
      - .github/workflows/docs-current-behavior-reconcile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/issue-105-cli-presentation

      - name: Apply documentation reconciliation
        run: python .github/docs-current-behavior-reconcile.py

      - name: Validate documentation edits
        run: |
          git diff --check
          python - <<'PY'
          from xml.etree import ElementTree
          for path in (
              'docs/images/isolation-install.svg',
              'docs/images/isolation-list.svg',
              'docs/images/isolation-direct-host.svg',
          ):
              ElementTree.parse(path)
          PY

      - name: Commit reconciled documentation
        run: |
          rm .github/workflows/docs-current-behavior-reconcile.yml .github/docs-current-behavior-reconcile.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconcile current CLI behavior and visuals'
          git push origin HEAD:release/issue-105-cli-presentation
