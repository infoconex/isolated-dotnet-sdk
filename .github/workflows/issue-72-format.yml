name: Issue 72 PowerShell formatting

on:
  push:
    branches:
      - security/72-verify-sdk-payload
    paths:
      - .github/issue-72-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/72-verify-sdk-payload
      - id: pwsh-cache-identity
        shell: pwsh
        run: '"version=$($PSVersionTable.PSVersion.ToString())" >> $env:GITHUB_OUTPUT'
      - id: powershell-module-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/powershell-modules
          key: isolated-dotnet-sdk-pwsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.pwsh-cache-identity.outputs.version }}-${{ hashFiles('.config/test-frameworks.json', '.config/static-analysis.json') }}
      - shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
            -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
            -CacheHit ('${{ steps.powershell-module-cache.outputs.cache-hit }}' -eq 'true')
      - shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Write
      - shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add isolated-dotnet-sdk.ps1
          if (-not (git diff --cached --quiet)) {
            git commit -m 'style: format SDK payload verification'
            git push origin HEAD:security/72-verify-sdk-payload
          }
