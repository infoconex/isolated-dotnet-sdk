name: Issue 72 Bash fixes

on:
  push:
    branches:
      - security/72-verify-sdk-payload
    paths:
      - .github/issue-72-fix2-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/72-verify-sdk-payload
      - shell: bash
        run: python .github/issue-72-fix2.py
      - shell: bash
        run: |
          set -euo pipefail
          bash -n isolated-dotnet-sdk.sh
          bash -n tests/bash/sdk-payload-fixture.bash
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add isolated-dotnet-sdk.sh tests/bash/sdk-payload-fixture.bash
          git commit -m 'fix: preserve SDK payload failure status'
          git push origin HEAD:security/72-verify-sdk-payload
