name: Issue 105 validation fixes

on:
  push:
    branches:
      - release/issue-105-cli-presentation

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: run issue 105 validation fixes' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation
      - name: Apply validation fixes
        shell: python
        run: |
          from pathlib import Path

          ps = Path('isolated-dotnet-sdk.ps1')
          text = ps.read_text()
          text = text.replace('function Write-ToolMetadata {', 'function Format-ToolAccent {')
          text = text.replace('$Metadata = Write-ToolMetadata -Message', '$Metadata = Format-ToolAccent -Message')
          ps.write_text(text)

          ps_test = Path('tests/powershell/presentation.Tests.ps1')
          text = ps_test.read_text().replace("$source | Should -Match 'function Write-ToolMetadata'", "$source | Should -Match 'function Format-ToolAccent'")
          ps_test.write_text(text)

          bash_test = Path('tests/bash/presentation.bats')
          text = bash_test.read_text()
          old = '''  [[ "$output" == *$'Tool installed.\\n\\nInstalled .NET SDKs'* ]]
'''
          new = '''  tool_installed_line=-1
  installed_heading_line=-1
  for ((i=0; i<${#lines[@]}; i++)); do
    [[ "${lines[$i]}" == "Tool installed." ]] && tool_installed_line=$i
    [[ "${lines[$i]}" == "Installed .NET SDKs" ]] && installed_heading_line=$i
  done
  [ "$tool_installed_line" -ge 0 ]
  [ "$installed_heading_line" -gt "$tool_installed_line" ]

  blank_boundary='false'
  for ((i=tool_installed_line + 1; i<installed_heading_line; i++)); do
    if [[ -z "${lines[$i]}" ]]; then
      blank_boundary='true'
      break
    fi
  done
  [ "$blank_boundary" = 'true' ]
'''
          if old not in text:
              raise SystemExit('Bash bootstrap assertion not found')
          bash_test.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/issue-105-fix.yml')
          workflow.unlink()
      - name: Commit validation fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align presentation checks with semantic helpers'
          git push origin HEAD:release/issue-105-cli-presentation

  bash-green:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bats-cache
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/bats
          key: isolated-dotnet-sdk-bats-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/test-frameworks.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: shellcheck-cache
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/shellcheck
          key: isolated-dotnet-sdk-shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/static-analysis.json') }}
      - shell: bash
        run: bash scripts/initialize-bash-validation.sh '${{ steps.bats-cache.outputs.cache-hit }}' '${{ steps.shellcheck-cache.outputs.cache-hit }}'
      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_home="$RUNNER_TEMP/shellcheck-home"
          mkdir -p "$shellcheck_home"
          printf 'shell=sh\n' > "$shellcheck_home/.shellcheckrc"
          HOME="$shellcheck_home" SHELLCHECK_OPTS='--shell=sh' bash scripts/run-shellcheck.sh
      - name: Run Bash behavioral tests
        shell: bash
        run: bash tests/bash/run-tests.sh

  powershell-green:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/issue-105-cli-presentation
          persist-credentials: false
      - name: Resolve PowerShell cache identity
        id: pwsh-cache-identity
        shell: pwsh
        run: '"version=$($PSVersionTable.PSVersion.ToString())" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: powershell-module-cache
        with:
          path: ${{ runner.temp }}/isolated-dotnet-sdk-cache/powershell-modules
          key: isolated-dotnet-sdk-pwsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.pwsh-cache-identity.outputs.version }}-${{ hashFiles('.config/test-frameworks.json', '.config/static-analysis.json') }}
      - shell: pwsh
        run: |
          & ./scripts/Initialize-PowerShellValidation.ps1 `
              -ModuleRoot (Join-Path $env:RUNNER_TEMP 'isolated-dotnet-sdk-cache/powershell-modules') `
              -CacheHit ('${{ steps.powershell-module-cache.outputs.cache-hit }}' -eq 'true') `
              -GitHubEnvironmentFile $env:GITHUB_ENV
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check PowerShell formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/powershell/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
