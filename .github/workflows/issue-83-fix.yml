name: Issue 83 validation fixes

on:
  push:
    branches:
      - release/issue-83-installed-sdk-listing
    paths:
      - .github/workflows/issue-83-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Fix successful empty Bash inventory status
        shell: pwsh
        run: |
          $path = 'isolated-dotnet-sdk.sh'
          $text = [System.IO.File]::ReadAllText($path)
          $oldInventory = @'
                  if sdk_output="$(dotnet --list-sdks)"; then
                      [[ -n "$sdk_output" ]] && printf "%s\n" "$sdk_output"
                  else
                      local status=$?
                      tool_fail "Unable to list SDKs through the system dotnet host with exit code $status."
                  fi
              fi
          }
          '@
          $newInventory = @'
                  if sdk_output="$(dotnet --list-sdks)"; then
                      if [[ -n "$sdk_output" ]]; then
                          printf "%s\n" "$sdk_output"
                      fi
                  else
                      local status=$?
                      tool_fail "Unable to list SDKs through the system dotnet host with exit code $status."
                  fi
              fi
              return 0
          }
          '@
          $oldVersions = @'
          get_system_sdk_versions() {
              local sdk_output=""
              sdk_output="$(get_system_sdk_inventory)"
              [[ -n "$sdk_output" ]] && printf "%s\n" "$sdk_output" | awk '{print $1}'
          }
          '@
          $newVersions = @'
          get_system_sdk_versions() {
              local sdk_output=""
              sdk_output="$(get_system_sdk_inventory)"
              if [[ -n "$sdk_output" ]]; then
                  printf "%s\n" "$sdk_output" | awk '{print $1}'
              fi
              return 0
          }
          '@
          if (-not $text.Contains($oldInventory)) { throw 'Expected Bash inventory block was not found.' }
          if (-not $text.Contains($oldVersions)) { throw 'Expected Bash version block was not found.' }
          $text = $text.Replace($oldInventory, $newInventory).Replace($oldVersions, $newVersions)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Install pinned PowerShell formatter
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath .config/static-analysis.json -Raw | ConvertFrom-Json
          Install-Module PSScriptAnalyzer -RequiredVersion ([string]$config.psScriptAnalyzerVersion) -Scope CurrentUser -Force -Repository PSGallery

      - name: Apply repository PowerShell formatting
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Invoke-PSFormatter.ps1 -Write

      - name: Remove temporary workflow
        shell: pwsh
        run: Remove-Item -LiteralPath .github/workflows/issue-83-fix.yml -Force

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: handle empty system SDK inventory'
          git push origin HEAD:release/issue-83-installed-sdk-listing
