name: Monitor pinned dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: pinned-dependency-update-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check pinned dependency updates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover newer stable pinned dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'dependency-updates.json'
          $reportPath = Join-Path $env:RUNNER_TEMP 'dependency-updates.md'

          & pwsh -NoProfile -File ./scripts/Invoke-DependencyUpdateCheck.ps1 `
              -ResultPath $resultPath `
              -ReportPath $reportPath
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Reconcile dependency update tracking issue
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'dependency-updates.json'
          $reportPath = Join-Path $env:RUNNER_TEMP 'dependency-updates.md'

          & pwsh -NoProfile -File ./scripts/Sync-DependencyUpdateIssue.ps1 `
              -ResultPath $resultPath `
              -ReportPath $reportPath
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
